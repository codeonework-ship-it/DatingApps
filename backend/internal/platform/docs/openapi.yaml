  /v1/blog/featured:
    get:
      tags: [blog]
      summary: The member's wall (shown on Today) of chapters delivered to them, newest delivery first (up to 20)
      description: Reach is tiered. By default 50 likes and 5 approved comments deliver a chapter to 50 members' walls and 100 likes and 10 comments to 100 (BLOG_WALL_TIERS overrides). Friends of the author are reached first, then members in the same city, then a stable pseudo-random order. A delivered chapter shows only while it is a community chapter with author opt-in, active, without an open report, first featured within the last 14 days. Authors receive wall_reach and next_tier on their own chapters.
      responses:
        '200': {description: Featured chapters with engagement counts}
        '401': {description: Authentication required}
  /v1/blog/posts/{postID}/like:
    parameters:
      - {in: path, name: postID, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [blog]
      summary: Like or react to a visible chapter (idempotent)
      description: Members cannot like their own chapter. 300 likes per member per day. Every reaction counts as one like for wall tiers, ranking and rewards. Reaching the featuring threshold for the first time records featured_at and notifies the author.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: false
        description: Optional empathetic reaction. Omit it (or send no body) for a plain like, which keeps a reaction already chosen. Changing the reaction is still one like, earns no new reward and does not count toward the daily limit.
        content:
          application/json:
            schema:
              type: object
              properties:
                reaction: {type: string, enum: [love, hear_you, me_too, with_you, hug, proud], description: "love = Love this, hear_you = I hear you, me_too = Me too, with_you = I'm with you, hug = Sending a hug, proud = Proud of you"}
      responses:
        '200': {description: "Updated chapter with like_count, liked_by_me, my_reaction (empty when not liked) and reactions (counts per reaction)"}
        '400': {description: Unknown reaction}
        '429': {description: Daily like limit reached}
        '401': {description: Authentication required}
        '403': {description: Own chapter, not the author, or feature disabled}
        '404': {description: Chapter or comment not visible to the member}
    delete:
      tags: [blog]
      summary: Remove the member's like (idempotent)
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200': {description: Updated chapter}
        '401': {description: Authentication required}
        '403': {description: Own chapter, not the author, or feature disabled}
        '404': {description: Chapter or comment not visible to the member}
  /v1/blog/posts/{postID}/comments:
    parameters:
      - {in: path, name: postID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [blog]
      summary: List comments oldest first (up to 200)
      description: Approved comments are visible to every reader of the chapter. Pending and declined comments are visible only to their writer and the chapter author. Removed comments are visible only to their writer.
      responses:
        '200': {description: Comments}
        '401': {description: Authentication required}
        '403': {description: Own chapter, not the author, or feature disabled}
