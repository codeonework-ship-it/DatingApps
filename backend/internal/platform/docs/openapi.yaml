          name: userID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Notification preferences
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPreferencesResponse'}
    patch:
      tags: [notifications]
      summary: Patch notification preferences
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationPreferences'}
      responses:
        '200':
          description: Updated notification preferences
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPreferencesResponse'}
        '400': {description: Preference values must be booleans}
  /v1/notifications/{userID}/devices:
    post:
      tags: [notifications]
      summary: Register or refresh a push-delivery device
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, platform, token]
              properties:
                provider:
                  type: string
                  enum: [fcm, apns, webhook]
                  description: FCM registration token or raw APNs device token namespace.
                platform: {type: string, enum: [android, ios, web]}
                token: {type: string, minLength: 1}
      responses:
        '201':
          description: Device registered; the token is deliberately not echoed
          content:
            application/json:
              schema:
                type: object
                required: [device_id, registered]
                properties:
                  device_id: {type: string, format: uuid}
                  registered: {type: boolean}
                  correlation_id: {type: string}
  /v1/notifications/{userID}/devices/{deviceID}:
    delete:
      tags: [notifications]
      summary: Disable a registered push-delivery device
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: deviceID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Device disabled}
        '404': {description: Device not found}
  /v1/notifications/{userID}/read-all:
    post:
      tags: [notifications]
      summary: Mark every visible notification as read
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Notifications marked read}
  /v1/notifications/{userID}/{notificationID}/read:
    post:
      tags: [notifications]
      summary: Mark one notification as read
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: notificationID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Notification marked read}
        '404': {description: Notification not found}
  /v1/notifications/{userID}/{notificationID}:
    delete:
      tags: [notifications]
      summary: Dismiss one notification
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: notificationID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Notification dismissed}
        '404': {description: Notification not found}
  /v1/admin/notifications/queue/metrics:
    get:
      tags: [admin, notifications]
      summary: Read notification queue and dead-letter telemetry
      responses:
        '200':
          description: Queue metrics
          content:
            application/json:
              schema:
                type: object
                required: [metrics, slo]
                properties:
                  metrics:
                    type: object
                    required: [queue_depth, processing, dead_letter, delivered, oldest_pending_age_seconds, push_attempts_15m, push_delivered_15m, push_dead_letter_15m, push_success_percent_15m, push_p95_latency_ms_15m]
                    properties:
                      queue_depth: {type: integer}
                      processing: {type: integer}
                      dead_letter: {type: integer}
                      delivered: {type: integer}
                      oldest_pending_age_seconds: {type: integer}
                      push_attempts_15m: {type: integer}
                      push_delivered_15m: {type: integer}
                      push_dead_letter_15m: {type: integer}
                      push_success_percent_15m: {type: number, format: double}
                      push_p95_latency_ms_15m: {type: number, format: double}
                  slo:
                    type: object
                    required: [met, max_queue_depth, max_oldest_pending_age_seconds, min_push_success_percent_15m]
                    properties:
                      met: {type: boolean}
                      max_queue_depth: {type: integer}
                      max_oldest_pending_age_seconds: {type: integer}
                      min_push_success_percent_15m: {type: integer}
                  correlation_id: {type: string}
        '403': {description: Administrator role required}

  /v1/progression/{userID}:
    get:
      summary: Get level and XP progression state
      parameters:
        - {in: path, name: userID, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Projected level state, ladder, rewards, and projection lag
          content: {application/json: {schema: {$ref: '#/components/schemas/ProgressionResponse'}}}
  /v1/progression/{userID}/ledger:
    get:
      summary: List append-only XP ledger entries
      parameters:
        - {in: path, name: userID, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: after, schema: {type: integer, format: int64}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Cursor-paginated XP ledger entries
          content: {application/json: {schema: {$ref: '#/components/schemas/XPLedgerResponse'}}}
  /v1/progression/{userID}/rewards/claim:
    post:
      summary: Claim an earned level reward
      parameters:
        - {$ref: '#/components/parameters/Idempotency-Key'}
        - {in: path, name: userID, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewardClaimRequest'
      responses:
        '200':
          description: Idempotent reward claim
          content: {application/json: {schema: {$ref: '#/components/schemas/RewardClaimResponse'}}}
        '409': {description: Reward unavailable or progression safety-frozen}
  /v1/admin/progression:
    get:
      summary: Admin progression overview, policies, experiments, and metrics
      responses:
        '200':
          description: Progression administration overview
          content: {application/json: {schema: {$ref: '#/components/schemas/ProgressionAdminResponse'}}}
  /v1/admin/progression/policies/{source}:
    put:
      summary: Update an XP source policy
      parameters:
        - {$ref: '#/components/parameters/Idempotency-Key'}
        - {in: path, name: source, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/XPPolicyUpdateRequest'}}}}
      responses: {'200': {description: Policy updated}}
  /v1/admin/progression/fraud:
    get:
      summary: List XP fraud review queue
      parameters:
        - {in: query, name: status, schema: {type: string, enum: [open, reviewing, dismissed, confirmed]}}
      responses:
        '200':
          description: Fraud cases
          content: {application/json: {schema: {$ref: '#/components/schemas/ProgressionFraudResponse'}}}
  /v1/admin/progression/fraud-rules/{ruleCode}:
    put:
      summary: Tune a bounded review-only XP fraud rule
      parameters:
        - {$ref: '#/components/parameters/Idempotency-Key'}
        - {in: path, name: ruleCode, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProgressionFraudRuleUpdateRequest'}}}}
      responses:
        '200': {description: Fraud review rule updated}
        '400': {description: Rule values are outside approved bounds}
  /v1/admin/progression/fraud/{caseID}/resolve:
    post:
      summary: Resolve an XP fraud case
      parameters:
        - {$ref: '#/components/parameters/Idempotency-Key'}
        - {in: path, name: caseID, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FraudResolutionRequest'}}}}
      responses: {'200': {description: Fraud case resolved}}
  /v1/admin/progression/users/{userID}/adjust-xp:
    post:
      summary: Post an audited compensating XP adjustment
      parameters:
        - {$ref: '#/components/parameters/Idempotency-Key'}
        - {in: path, name: userID, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/XPAdjustmentRequest'}}}}
      responses:
        '200':
          description: Adjustment ledger event accepted
          content: {application/json: {schema: {$ref: '#/components/schemas/XPAwardResponse'}}}
  /v1/admin/progression/users/{userID}/control:
    put:
      summary: Freeze or risk-limit a user's progression
      parameters:
        - {$ref: '#/components/parameters/Idempotency-Key'}
        - {in: path, name: userID, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProgressionControlRequest'}}}}
      responses: {'200': {description: Progression control updated}}
  /v1/admin/progression/experiments/{key}:
    put:
      summary: Update progression experiment rollout
      parameters:
        - {$ref: '#/components/parameters/Idempotency-Key'}
        - {in: path, name: key, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExperimentUpdateRequest'}}}}
      responses: {'200': {description: Experiment updated}}

  /v1/growth/portfolio:
    get:
      summary: Read the governed P2 growth portfolio and launch state
      responses:
        '200': {description: Module owners, risk, runtime state and blockers}
  /v1/support/tickets:
    get:
      tags: [support]
      summary: List the member's support requests (runtime flag support_ticketing_enabled)
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [all, active, closed], default: all}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: The member's tickets, open first, most recent activity first
          content:
            application/json:
              schema:
                type: object
                required: [success, tickets, unread_total, open_total]
                properties:
                  success: {type: boolean}
                  tickets: {type: array, items: {$ref: '#/components/schemas/SupportTicket'}}
                  unread_total: {type: integer, description: Support replies the member has not opened yet}
                  open_total: {type: integer}
        '403': {description: Support ticketing is disabled by runtime policy (FEATURE_DISABLED)}
    post:
      tags: [support]
      summary: Raise a support request with optional pre-uploaded attachments
      description: >-
        Category decides the queue (team) and starting priority; safety_harassment
        tickets go to Trust & Safety at high priority with a 1 h first-response
        and 24 h resolution target. App version and device fields are optional
        diagnostics. The same request again within 10 minutes returns the
        existing ticket with duplicate=true. Limits: 5 per hour, 15 per day,
        10 unresolved tickets.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, subject, description]
              properties:
                category: {$ref: '#/components/schemas/SupportCategory'}
                subject: {type: string, minLength: 4, maxLength: 120}
                description: {type: string, minLength: 1, maxLength: 5000}
                attachment_ids: {type: array, maxItems: 5, items: {type: string, format: uuid}}
                app_version: {type: string, maxLength: 32}
                platform: {type: string, enum: [android, ios, web, macos, windows, linux]}
                os_version: {type: string, maxLength: 32}
                device_model: {type: string, maxLength: 64}
                locale: {type: string, maxLength: 16}
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupportTicketThread'}
        '200':
          description: The same request was raised moments ago; the existing ticket is returned with duplicate=true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupportTicketThread'}
        '400': {description: Invalid category, subject, description or attachment ids}
        '409': {description: SUPPORT_TOO_MANY_OPEN or SUPPORT_ATTACHMENT_LIMIT}
        '429':
          description: SUPPORT_RATE_LIMITED; retry_after_seconds in the body
          headers:
            Retry-After: {schema: {type: integer, minimum: 1}, description: Seconds to wait}
  /v1/support/tickets/{ticketID}:
    parameters:
      - {name: ticketID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [support]
      summary: Read one of the member's tickets with its public conversation (marks replies read)
      responses:
        '200':
          description: Ticket and public messages; internal operator notes are never returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupportTicketThread'}
        '404': {description: Ticket does not exist or belongs to someone else}
  /v1/support/tickets/{ticketID}/messages:
    parameters:
      - {name: ticketID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [support]
      summary: Reply on a ticket (reopens a resolved ticket; resets waiting-on-member)
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: {type: string, maxLength: 5000, description: May be empty when attachment_ids are given}
                attachment_ids: {type: array, maxItems: 5, items: {type: string, format: uuid}}
      responses:
        '201':
          description: Reply stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  ticket: {$ref: '#/components/schemas/SupportTicket'}
                  message: {$ref: '#/components/schemas/SupportMessage'}
        '400': {description: Empty or oversized message, or unknown attachment}
        '404': {description: Ticket not found}
        '409': {description: SUPPORT_TICKET_CLOSED (reopen window passed) or SUPPORT_TICKET_MERGED}
        '429': {description: SUPPORT_RATE_LIMITED (30 replies per hour)}
  /v1/support/tickets/{ticketID}/close:
    parameters:
      - {name: ticketID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [support]
      summary: Close one of the member's tickets
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200': {description: Ticket closed (idempotent), content: {application/json: {schema: {$ref: '#/components/schemas/SupportTicketEnvelope'}}}}
        '404': {description: Ticket not found}
  /v1/support/tickets/{ticketID}/reopen:
    parameters:
      - {name: ticketID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [support]
      summary: Reopen a resolved ticket, or a closed one within 14 days of closing
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 5000, description: Optional message added to the conversation}
      responses:
        '200': {description: Ticket open again, content: {application/json: {schema: {$ref: '#/components/schemas/SupportTicketEnvelope'}}}}
        '404': {description: Ticket not found}
        '409': {description: SUPPORT_REOPEN_WINDOW_PASSED}
  /v1/support/tickets/{ticketID}/rating:
    parameters:
      - {name: ticketID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [support]
      summary: Rate the support experience once the ticket is resolved (CSAT)
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: {type: integer, minimum: 1, maximum: 5}
                comment: {type: string, maxLength: 1000}
      responses:
        '200': {description: Rating stored, content: {application/json: {schema: {$ref: '#/components/schemas/SupportTicketEnvelope'}}}}
        '400': {description: Rating outside 1-5 or comment too long}
        '409': {description: SUPPORT_NOT_RESOLVED or SUPPORT_ALREADY_RATED}
  /v1/support/tickets/{ticketID}/attachments/{attachmentID}:
    parameters:
      - {name: ticketID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: attachmentID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [support]
      summary: Download an attachment on one of the member's tickets
      responses:
        '200':
          description: File bytes (private, no-store; PDFs as an attachment)
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            application/pdf: {schema: {type: string, format: binary}}
        '404': {description: Not the member's ticket, an internal note's file, or removed}
  /v1/support/attachments:
    post:
      tags: [support]
      summary: Upload a screenshot or PDF to attach to a new ticket or reply
      description: >-
        JPEG/PNG up to 8 MB (8000 px per side; re-encoded server-side, which
        strips EXIF/GPS metadata) or PDF up to 10 MB without scripts, actions,
        forms or embedded files. The type is sniffed from the bytes. Unattached
        uploads are deleted after 24 hours. Limits: 30 uploads per hour, 20
        pending. Not idempotent-keyed (multipart); retries create a new
        pending upload that expires unused.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: Upload stored, pending attachment
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  attachment: {$ref: '#/components/schemas/SupportAttachment'}
        '400': {description: Missing file field}
        '413': {description: File too large}
        '415': {description: Unsupported or unsafe file type}
        '429': {description: SUPPORT_RATE_LIMITED}
  /v1/support/contact:
    post:
      tags: [support]
      security: [{}]
      summary: Website contact form for signed-out visitors (never creates an account)
      description: >-
        Creates a website-channel ticket that carries only the email address
        and optional name given; the support team replies by email. The
        `website` field is a honeypot and must be empty (a filled honeypot is
        answered 202 without storing anything). Limits: 5 per hour per IP (the
        IP is held in memory only), 3 per hour and 10 per day per address,
        300 per hour overall. Gated by support_ticketing_enabled. Not
        idempotent-keyed: the same request within 10 minutes returns the same
        reference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, category, subject, description]
              properties:
                email: {type: string, format: email, maxLength: 254}
                name: {type: string, maxLength: 100}
                category: {$ref: '#/components/schemas/SupportCategory'}
                subject: {type: string, minLength: 4, maxLength: 120}
                description: {type: string, minLength: 1, maxLength: 5000}
                locale: {type: string, maxLength: 16}
                website: {type: string, description: Honeypot; leave empty}
      responses:
        '202':
          description: Request received
          content:
            application/json:
              schema:
                type: object
                required: [success, received]
                properties:
                  success: {type: boolean}
                  received: {type: boolean}
                  reference: {type: string, example: CN-2026-000124}
        '400': {description: Invalid email, category, subject or description}
        '403': {description: Support ticketing is disabled by runtime policy (FEATURE_DISABLED)}
        '429': {description: SUPPORT_RATE_LIMITED; retry_after_seconds in the body}
  /v1/growth/events:
    get:
      summary: List published free community events
      responses:
        '200': {description: Events with capacity and safety contact}
        '403': {description: Growth events runtime policy is disabled}
  /v1/growth/events/{eventID}/registration:
    parameters:
      - {name: eventID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Register for a free event after accepting its safety terms
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [safety_terms_accepted]
              properties:
                safety_terms_accepted: {type: boolean, const: true}
      responses:
        '200': {description: Registration active}
        '409': {description: Event is full}
    delete:
      summary: Cancel the authenticated member's event registration
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200': {description: Registration cancelled}
  /v1/growth/referrals/me:
    get:
      summary: Get the member's non-reward referral code
      responses:
        '200': {description: Referral code; reward is always null in this phase}
        '404': {description: Referral code has not been created}
    post:
      summary: Create the member's non-reward referral code idempotently
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200': {description: Referral code; reward is always null in this phase}
  /v1/growth/referrals/redeem:
    post:
      summary: Record a referral without granting coins, XP, cash or entitlement
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, pattern: '^[A-Z0-9]{8,16}$'}
      responses:
        '201': {description: Redemption recorded with reward_granted false}
        '409': {description: Invalid, self-owned or previously redeemed code}
  /v1/growth/partnerships:
    get:
      summary: List due-diligence-approved published partners
      responses:
        '200': {description: Published partner directory}
  /v1/growth/recommendations:
    get:
      summary: List active recommendation edges with member-visible reasons
      responses:
        '200': {description: Explainable, versioned recommendation edges}
  /v1/growth/imports/consents:
    put:
      summary: Grant revocable social discovery consent without ingesting contacts
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: {type: string, enum: [google_contacts, apple_contacts, manual]}
      responses:
        '200': {description: Thirty-day consent stored; contacts_ingested is zero}
  /v1/growth/imports/consents/{provider}:
    parameters:
      - {name: provider, in: path, required: true, schema: {type: string}}
    delete:
      summary: Revoke social discovery consent
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200': {description: Consent revoked}
  /v1/growth/history:
    get:
      summary: Read member-controlled preference and city check-in history
      responses:
        '200': {description: History without precise coordinates}
    delete:
      summary: Delete the authenticated member's growth history
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200': {description: History deleted immediately}
  /v1/growth/history/preferences:
    post:
      summary: Capture an explicit snapshot of approved preference fields
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '201': {description: Preference snapshot created}
  /v1/growth/history/location-checkins:
    post:
      summary: Store a foreground city check-in that expires after thirty days
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [city, state, country]
              properties:
                city: {type: string, maxLength: 100}
                state: {type: string, maxLength: 100}
                country: {type: string, maxLength: 100}
      responses:
        '201': {description: Coarse location check-in stored}
  /v1/growth/admirer-gifts:
    post:
      summary: Blocked admirer gift boundary reserved for an approved monetized rollout
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '403': {description: Feature policy or growth launch contract blocks the action}
  /v1/growth/paid-xp:
    post:
      summary: Blocked paid-XP boundary reserved for an approved monetized rollout
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '403': {description: Feature policy or growth launch contract blocks the action}
  /v1/admin/support/tickets:
    get:
      tags: [support]
      summary: Support queue with filters and SLA state (admin, ops_admin, support, trust_safety, moderator)
      parameters:
        - {name: status, in: query, schema: {type: string, default: active}, description: 'active (unresolved), all, or a comma list of new, open, pending_member, on_hold, resolved, closed'}
        - {name: category, in: query, schema: {type: string}, description: Comma list of categories}
        - {name: priority, in: query, schema: {type: string}, description: Comma list of low, normal, high, urgent}
        - {name: team, in: query, schema: {type: string}, description: Comma list of general, trust_safety, billing, privacy, technical}
        - {name: channel, in: query, schema: {type: string}, description: Comma list of app, website, email}
        - {name: assignee, in: query, schema: {type: string}, description: me, unassigned or an operator id}
        - {name: member, in: query, schema: {type: string, format: uuid}, description: Requesting member id}
        - {name: sla, in: query, schema: {type: string, enum: [breached, at_risk]}}
        - {name: q, in: query, schema: {type: string, maxLength: 100}, description: Exact reference (CN-YYYY-NNNNNN), or text matched against subject, reference, member username/name; an email matches website tickets exactly}
        - {name: sort, in: query, schema: {type: string, enum: [sla, priority, updated, created, oldest], default: sla}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Matching tickets, next SLA target first by default
          content:
            application/json:
              schema:
                type: object
                required: [success, tickets, total, counts]
                properties:
                  success: {type: boolean}
                  tickets: {type: array, items: {$ref: '#/components/schemas/SupportAdminTicket'}}
                  total: {type: integer}
                  limit: {type: integer}
                  offset: {type: integer}
                  counts:
                    type: object
                    description: All tickets by status
                    additionalProperties: {type: integer}
        '400': {description: Unknown filter value}
        '403': {description: Operator role does not permit this action}
  /v1/admin/support/tickets/export:
    get:
      tags: [support]
      summary: Export the filtered queue as CSV (operational fields only; no subjects, messages, names or emails)
      description: Same filters as the queue; status defaults to all. At most 10,000 rows, newest first. Cells that could start a spreadsheet formula are prefixed with an apostrophe.
      parameters:
        - {name: status, in: query, schema: {type: string, default: all}}
        - {name: category, in: query, schema: {type: string}}
        - {name: priority, in: query, schema: {type: string}}
        - {name: team, in: query, schema: {type: string}}
        - {name: channel, in: query, schema: {type: string}}
        - {name: assignee, in: query, schema: {type: string}}
        - {name: sla, in: query, schema: {type: string, enum: [breached, at_risk]}}
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
      responses:
        '200':
          description: CSV attachment
          content:
            text/csv: {schema: {type: string}}
        '400': {description: Unknown filter value}
  /v1/admin/support/tickets/bulk:
    post:
      tags: [support]
      summary: Claim, assign, set status or set priority on up to 100 tickets
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket_ids, action]
              properties:
                ticket_ids: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}
                action: {type: string, enum: [claim, assign, status, priority]}
                value: {type: string, description: Operator id (assign; empty unassigns), status or priority}
      responses:
        '200':
          description: Per-ticket outcome; each ticket is changed in its own transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  updated: {type: array, items: {type: string}}
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        error: {type: string}
        '400': {description: Invalid action, value or ticket list}
  /v1/admin/support/tickets/{ticketID}:
    parameters:
      - {name: ticketID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [support]
      summary: Ticket with the full thread (internal notes included), event trail and minimal member context
      responses:
        '200':
          description: Ticket detail
          content:
            application/json:
              schema:
                type: object
                required: [success, ticket, messages, events]
                properties:
                  success: {type: boolean}
                  ticket: {$ref: '#/components/schemas/SupportAdminTicket'}
                  messages: {type: array, items: {$ref: '#/components/schemas/SupportAdminMessage'}}
                  events: {type: array, items: {$ref: '#/components/schemas/SupportTicketEvent'}}
                  member_context:
                    nullable: true
                    allOf: [{$ref: '#/components/schemas/SupportMemberContext'}]
                  related_tickets:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        reference: {type: string}
                        subject: {type: string}
                        status: {type: string}
                        created_at: {type: string, format: date-time}
        '404': {description: Ticket not found}
    patch:
      tags: [support]
      summary: Change status, priority, category, team, assignee, tags or the linked client error
      description: >-
        Every changed field is recorded in the event trail. Priority and
        category changes recompute the SLA targets; a category change also
        moves the ticket to that category's team unless team is given, and a
        safety category raises the priority to at least high. Resolving or
        closing notifies the member (category system, route /support/tickets/{id}).
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {$ref: '#/components/schemas/SupportStatus'}
                priority: {type: string, enum: [low, normal, high, urgent]}
                category: {$ref: '#/components/schemas/SupportCategory'}
                team: {type: string, enum: [general, trust_safety, billing, privacy, technical]}
                assignee_id: {type: string, description: Operator id; empty string unassigns}
                tags: {type: array, maxItems: 20, items: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'}}
                client_error_issue_id: {type: string, description: Client error issue id; empty string clears}
      responses:
        '200': {description: Updated ticket, content: {application/json: {schema: {$ref: '#/components/schemas/SupportAdminTicketEnvelope'}}}}
        '400': {description: Invalid change or assignee without a support role}
        '404': {description: Ticket not found}
        '409': {description: SUPPORT_TICKET_MERGED}
  /v1/admin/support/tickets/{ticketID}/claim:
    parameters:
      - {name: ticketID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [support]
      summary: Assign the ticket to the calling operator (a new ticket becomes open)
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
        - {name: force, in: query, schema: {type: string, enum: ['1']}, description: Take over a ticket owned by someone else}
      responses:
        '200': {description: Claimed, content: {application/json: {schema: {$ref: '#/components/schemas/SupportAdminTicketEnvelope'}}}}
        '404': {description: Ticket not found}
        '409': {description: SUPPORT_ALREADY_ASSIGNED}
  /v1/admin/support/tickets/{ticketID}/messages:
    parameters:
      - {name: ticketID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [support]
      summary: Reply to the member (public) or add an internal note
      description: >-
        A public reply records the first response, assigns an unowned ticket
        to the replier, moves new/open tickets to pending_member unless status
        is given, and notifies the member (support.reply). Website tickets have
        no account: the reply is recorded and the agent sends it by email.
        With an empty body and canned_response_id the canned response is
        rendered ({{member_name}}, {{reference}}, {{agent_name}}).
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: {type: string, maxLength: 5000}
                visibility: {type: string, enum: [public, internal], default: public}
                canned_response_id: {type: string, format: uuid}
                status: {$ref: '#/components/schemas/SupportStatus'}
      responses:
        '201':
          description: Message stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  ticket: {$ref: '#/components/schemas/SupportAdminTicket'}
                  message: {$ref: '#/components/schemas/SupportAdminMessage'}
        '400': {description: Empty or oversized body, or invalid visibility/status}
        '404': {description: Ticket or canned response not found}
        '409': {description: SUPPORT_TICKET_MERGED}
  /v1/admin/support/tickets/{ticketID}/merge:
    parameters:
      - {name: ticketID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [support]
      summary: Merge this ticket into another ticket from the same requester
      description: Messages and attachments move to the target, the source closes with merged_into set, and both trails record the merge.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                into_ticket_id: {type: string, format: uuid}
                into_reference: {type: string, example: CN-2026-000123}
      responses:
        '200': {description: Target ticket after the merge, content: {application/json: {schema: {$ref: '#/components/schemas/SupportAdminTicketEnvelope'}}}}
        '400': {description: Missing or same target}
        '404': {description: Ticket not found}
        '409': {description: Different requesters, already merged, or closed target}
  /v1/admin/support/tickets/{ticketID}/canned-responses/{responseID}/preview:
    parameters:
      - {name: ticketID, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: responseID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [support]
      summary: Render a canned response for this ticket (placeholders filled)
      responses:
        '200':
          description: Rendered text
          content:
            application/json:
