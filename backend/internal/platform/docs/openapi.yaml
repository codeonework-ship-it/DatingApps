  /v1/rooms:
    get:
      tags: [rooms]
      summary: List live chat rooms
      description: >-
        Always-on public topic rooms and member-hosted rooms (migration 117),
        live rooms first and busiest first. Without state, rooms that have not
        closed; state=closed lists rooms closed in the last 7 days. Rooms
        hosted by someone either side blocked are left out. Member ids are
        never listed; use /members after joining.
      parameters:
        - {in: query, name: state, required: false, schema: {type: string, enum: [active, scheduled, closed]}}
        - {in: query, name: category, required: false, schema: {type: string, enum: [talk, interests, active, city]}}
        - {in: query, name: friend_only, required: false, schema: {type: boolean}, description: Only rooms a friend (or you) is in}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200': {description: "{rooms: [{id, slug, title, theme, description, category, icon_key, emoji, room_type, city, always_on, lifecycle_state, starts_at, ends_at, capacity, participant_count, here_now, friends_here, is_participant, my_role, can_moderate, is_host, host_name, channel_id}], count, categories: [{key, label}]}"}
        '401': {description: Authentication required}
    post:
      tags: [rooms]
      summary: Start a room you host
      description: >-
        One open hosted room per member and at most 3 a day. 30 to 180
        minutes, starting now or within 7 days, for 2 to 50 people. The host
        can warn, remove and close.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: {type: string, minLength: 3, maxLength: 60}
                description: {type: string, maxLength: 280}
                category: {type: string, enum: [talk, interests, active, city], default: talk}
                starts_at: {type: string, format: date-time}
                duration_minutes: {type: integer, minimum: 30, maximum: 180, default: 60}
                capacity: {type: integer, minimum: 2, maximum: 50, default: 30}
      responses:
        '201': {description: "{room} with my_role host and channel_id"}
        '400': {description: Invalid title, category, time, duration or capacity}
        '401': {description: Authentication required}
        '409': {description: Already hosting an open room}
        '429': {description: Three rooms started in the last 24 hours}
  /v1/rooms/{roomID}:
    parameters:
      - {in: path, name: roomID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [rooms]
      summary: Room detail with presence, my role and (for members) the chat channel
      responses:
        '200': {description: "{room, guidelines: [string]}; room.channel_id is set only for members of an open room"}
        '401': {description: Authentication required}
        '404': {description: No such room, or hosted by someone either side blocked}
  /v1/rooms/{roomID}/members:
    parameters:
      - {in: path, name: roomID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [rooms]
      summary: People in the room (members only)
      description: Hosts first, then who is here now. Members either side blocked are left out. friend_status is me, friends, requested, incoming or none. muted_until (when a member is muted) is shown to the room's hosts and moderators, and to the muted member themselves.
      responses:
        '200': {description: "{members: [{user_id, name, photo_url, role, here_now, joined_at, is_me, friend_status, muted_until?}], count, here_now}"}
        '401': {description: Authentication required}
        '404': {description: Not a member of this open room}
  /v1/rooms/{roomID}/join:
    parameters:
      - {in: path, name: roomID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [rooms]
      summary: Join a room (idempotent) and get its chat channel
      description: >-
        Joining an open room adds you to its chat (shared chat engine, kind
        room) and returns channel_id. A body is optional; a user_id other than
        the caller is refused. A member blocked by (or blocking) someone in the
        room may still join; the chat hides each side's messages.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: {type: string, description: Optional; must be the caller}
      responses:
        '200': {description: "{room, joined: true, channel_id}"}
        '401': {description: Authentication required}
        '403': {description: user_id names someone else, or the account cannot join}
        '404': {description: No such room}
        '409': {description: "error_code ROOM_CLOSED, ROOM_CAPACITY_REACHED or ROOM_BLOCKED_ACTIVE_SESSION (removed until the session ends; 24 hours for always-on rooms)"}
  /v1/rooms/{roomID}/leave:
    parameters:
      - {in: path, name: roomID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [rooms]
      summary: Leave a room; chat access ends at once
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: {type: string, description: Optional; must be the caller}
      responses:
        '200': {description: "{room, left: true}"}
        '401': {description: Authentication required}
        '404': {description: No such room}
        '409': {description: error_code ROOM_NOT_JOINED}
  /v1/rooms/{roomID}/presence:
    parameters:
      - {in: path, name: roomID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [rooms]
      summary: Presence heartbeat for "N here now"
      description: Send every 30-60 seconds while the room is open on screen, and state=away when leaving the screen. A member counts as here now for two minutes after a heartbeat; one who is not seen for 24 hours drops out of the room until they rejoin.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                state: {type: string, enum: [here, away], default: here}
      responses:
        '200': {description: "{room, here_now, participant_count}"}
        '401': {description: Authentication required}
        '404': {description: No such room}
        '409': {description: "error_code ROOM_NOT_JOINED, ROOM_BLOCKED_ACTIVE_SESSION (removed) or ROOM_CLOSED"}
  /v1/rooms/{roomID}/moderate:
    parameters:
      - {in: path, name: roomID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [rooms]
      summary: Warn, mute, unmute or remove a member (room hosts and moderators only)
      description: >-
        The caller must be a current host or moderator of the room; the
        moderator is always the caller (moderator_user_id, if sent, must be the
        caller). Moderators cannot act on moderators, nobody but an operator
        acts on a host, and nobody acts on themselves. mute_user makes the
        member read-only in the room's chat (they keep reading and receiving
        real-time events; posting returns 403 CHANNEL_READ_ONLY) for duration
        10m (default), 1h or session (until the room ends; 24 hours for
        always-on rooms), or duration_minutes (1-1440); a mute never outlasts
        a hosted room, survives leaving and rejoining, and muting again moves
        its end. unmute_user lifts it (a no-op, not logged, when the member is
        not muted). Mutes and unmutes are logged, notify the member
        (room.moderation.mute / room.moderation.unmute) and send them a
        social.channel.updated real-time event. Removal ends the member's chat
        access and blocks rejoining until the session ends (24 hours for
        always-on rooms). The host may also close their own hosted room with
        close_room.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                moderator_user_id: {type: string, description: Optional; must be the caller}
                target_user_id: {type: string, format: uuid}
                action: {type: string, enum: [warn_user, mute_user, unmute_user, remove_user, close_room]}
                reason: {type: string, maxLength: 280}
                duration: {type: string, enum: ['10m', '1h', session], description: mute_user only}
                duration_minutes: {type: integer, minimum: 1, maximum: 1440, description: mute_user only; wins over duration}
      responses:
        '200': {description: "{room, moderation_action: {id, room_id, moderator_user_id, target_user_id, action, reason, created_at, muted_until?}, policy_enforced: true}"}
        '400': {description: Unknown action or duration, missing target, or targeting yourself}
        '401': {description: Authentication required}
        '403': {description: Not a host or moderator of this room, moderator spoofed, or the target is a host or fellow moderator}
        '404': {description: No such room}
        '409': {description: error_code ROOM_NOT_JOINED (target not in the room) or ROOM_NOT_ACTIVE}
  /v1/billing/account:
    get:
      summary: Read the signed-in member's payment account and recoverable checkouts
      description: >-
        Uses only the authenticated principal; query parameters cannot select another member.
        No customer or payment is created. Returns account name/email, provider,
        mode (sandbox, test, live, disabled), customer_connected, payment_methods
        and up to five unexpired open subscription/card-update checkouts.
        Never returns provider secrets or customer IDs. Billing release and runtime gates apply.
      responses:
        '200':
          description: Private account payload, Cache-Control no-store
        '401':
          description: Authentication required
        '403':
          description: Billing excluded from release or disabled by policy
        '503':
          description: Durable billing account unavailable
  /v1/billing/plans:
    get:
      summary: List billing subscription plans
      responses:
        '200':
          description: Billing plans payload with coexistence matrix
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/BillingPlan'
                  coexistence_matrix:
                    $ref: '#/components/schemas/BillingCoexistenceMatrix'
  /v1/operations/status:
    get:
      summary: Recover the durable outcome of an idempotent command
      description: Returns the cached result, active processing state, or an explicit recovery-required state for the authenticated actor.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: method
          required: true
          schema:
            type: string
            enum: [POST, PUT, PATCH, DELETE]
        - in: query
          name: path
          required: true
          schema:
            type: string
        - in: query
          name: idempotency_key
          required: true
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: Durable command status and cached result when completed
        '400':
          description: Missing or invalid command identity
        '401':
          description: Authentication required
        '404':
          description: Operation record not found or expired
        '503':
          description: Operation recovery store unavailable
  /v1/config/flags:
    get:
      summary: Read application runtime feature flags
      description: Returns the current database-backed feature switches for an authenticated application session.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current runtime feature flags
          content:
            application/json:
              schema:
                type: object
                required: [flags, source]
                properties:
                  source:
                    type: string
                    enum: [db, defaults]
                  flags:
                    type: array
                    items:
                      type: object
                      required: [key, value_bool]
                      properties:
                        key:
                          type: string
                        value_bool:
                          type: boolean
                        updated_at:
                          type: string
                          format: date-time
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/billing/checkout:
    post:
      summary: Start a card checkout for an auto-renewing subscription
      description: >-
        Creates a hosted, card-only checkout at the configured payment provider
        for the selected plan and billing cycle. Nothing is activated by this
        call: the subscription becomes active only when the provider's signed
        webhook reports the first charge as settled. The response carries the
        checkout URL to open in the app's checkout view; the app then polls
        `GET /v1/billing/checkout/{checkoutID}` until it completes. Refused
        with 409 while a paid subscription is already live.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [subscription, coin_package, card_update]
                  default: subscription
                  description: >-
                    What is being bought. `coin_package` is a single card charge
                    that credits the wallet once settled. `card_update` collects a
                    replacement card for the live subscription without charging it.
                plan_id: {type: string, description: Plan code, e.g. `gold` (kind=subscription)}
                billing_cycle: {type: string, enum: [monthly, yearly], default: monthly}
                package_id: {type: string, description: Coin package id from `GET /v1/billing/coin-packages` (kind=coin_package)}
                user_id: {type: string, description: Optional; must equal the authenticated user}
      responses:
        '201':
          description: Checkout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCheckoutResponse'
        '200':
          description: Existing checkout returned for a repeated Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCheckoutResponse'
        '400':
          description: Invalid plan/cycle or free plan requested
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Plan not found or inactive
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: A paid subscription is already live for this member
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '501':
          description: Card payments are not enabled on this server
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Billing persistence unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/billing/coin-packages:
    get:
      summary: List purchasable coin packages
      description: >-
        Active coin packs with their price, currency, bonus and the total coins
        credited. Buy one with `POST /v1/billing/checkout` (`kind=coin_package`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Coin packages
          content:
            application/json:
              schema:
                type: object
                required: [packages]
                properties:
                  provider: {type: string}
                  packages:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        label: {type: string}
                        coin_amount: {type: integer}
                        bonus_percent: {type: number}
                        total_coins: {type: integer}
                        price: {type: number}
                        amount_minor: {type: integer}
                        currency: {type: string}
                        description: {type: string}
                        sort_order: {type: integer}
        '501':
          description: Card payments are not enabled on this server
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/billing/checkout/return:
    get:
      summary: Hosted checkout return page
      description: >-
        Public HTML landing page the provider redirects to after checkout
        (`status=success|cancelled`, `checkout_id`). The app intercepts this URL
        inside its checkout view and does not render it.
      parameters:
        - in: query
          name: status
          schema: {type: string, enum: [success, cancelled]}
        - in: query
          name: checkout_id
          schema: {type: string}
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema: {type: string}
  /v1/billing/checkout/{checkoutID}:
    get:
      summary: Read a checkout session's status
      description: >-
        Returns the checkout row. Once the provider webhook has settled the
        first charge the status is `completed` and the response also carries the
        resulting subscription. Only the member who started the checkout may
        read it.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: checkoutID
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Checkout status
          content:
            application/json:
              schema:
                type: object
                required: [checkout]
                properties:
                  checkout: {$ref: '#/components/schemas/BillingCheckout'}
                  subscription: {$ref: '#/components/schemas/UserSubscription'}
                  wallet:
                    type: object
                    description: Present for a completed coin-package checkout
                    properties:
                      user_id: {type: string}
                      coin_balance: {type: integer}
                      updated_at: {type: string, format: date-time}
                  correlation_id: {type: string}
        '403':
          description: Checkout belongs to another member
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Checkout not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/billing/subscription/{userID}/cancel:
    post:
      summary: Turn off auto-renew
      description: >-
        Asks the provider to stop renewing at the end of the current paid
        period. Access continues until `current_period_end`; the subscription
        then ends when the provider reports it. Mirrors `cancel_at_period_end`
        locally straight away.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Updated subscription
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingSubscriptionResponse'}
        '404':
          description: No paid subscription to change
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Subscription is managed by a different provider
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/billing/subscription/{userID}/resume:
    post:
      summary: Turn auto-renew back on
      description: >-
        Reverses a pending cancel-at-period-end before the period ends, so the
        card is charged again at `next_billing_date`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Updated subscription
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingSubscriptionResponse'}
        '404':
          description: No paid subscription to change
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/billing/entitlements/{userID}:
    get:
      summary: Today's like and message quotas for the member's plan
      description: >-
        The plan of the live paid subscription (or Free) sets `likes_per_day`
        and `messages_per_day` (-1 = unlimited). Usage is counted from durable
        swipes and messages over the current UTC day. `POST /v1/swipe` (likes)
        and `POST /v1/chat/{matchID}/messages` answer 429 with
        `DAILY_LIKE_LIMIT_REACHED` / `DAILY_MESSAGE_LIMIT_REACHED` and the same
        `limit`, `used`, `plan_id`, `resets_at` fields once a quota is used up
        (`BILLING_ENFORCE_DAILY_LIMITS`, default on).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userID
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Entitlements
          content:
            application/json:
              schema:
                type: object
                required: [plan_id, plan_name, enforced, likes, messages]
                properties:
                  plan_id: {type: string}
                  plan_name: {type: string}
                  enforced: {type: boolean}
                  resets_at: {type: string, format: date-time}
                  likes: {$ref: '#/components/schemas/DailyQuota'}
                  messages: {$ref: '#/components/schemas/DailyQuota'}
  /v1/billing/subscription/{userID}/change-plan:
    post:
      summary: Switch plan or billing cycle
      description: >-
        Moves the live paid subscription to another plan/cycle at the provider.
        An upgrade (higher daily price) invoices the prorated difference
        immediately; a downgrade credits the unused time against the next
        invoice. Refused while a payment is outstanding (`past_due`), for the
        same plan/cycle, or for the free plan (turn auto-renew off instead).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: {type: string}
                billing_cycle: {type: string, enum: [monthly, yearly], default: monthly}
      responses:
        '200':
          description: Updated subscription
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingSubscriptionResponse'}
        '404':
          description: No paid subscription, or plan not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Same plan, outstanding payment, or provider mismatch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/billing/webhooks/{provider}:
    post:
      summary: Payment provider webhook
      description: >-
        Receives signed provider events (`Stripe-Signature` header, HMAC-SHA256
        over `t.payload`, 5 minute replay tolerance). Every verified event is
        recorded once per `(provider, event_id)`; duplicates are acknowledged
        without being reapplied and out-of-order deliveries cannot roll a
        subscription backwards. Handled types: `checkout.session.completed`,
        `invoice.paid`, `invoice.payment_failed`, `customer.subscription.*`,
        `charge.refunded`. A 5xx asks the provider to retry.
      parameters:
        - in: path
          name: provider
          required: true
          schema: {type: string, enum: [stripe, sandbox]}
        - in: header
          name: Stripe-Signature
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Event acknowledged (processed, ignored or duplicate)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: {type: boolean}
        '400':
          description: Invalid signature or malformed payload
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Provider is not the configured one
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Event could not be applied; the provider should retry
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/billing/sandbox/checkout/{sessionID}:
    get:
      summary: Sandbox hosted card form (non-production)
      description: >-
        Only served when `PAYMENTS_PROVIDER=sandbox`. Renders a card form for a
        checkout session created by `POST /v1/billing/checkout`. Test cards:
        `4242424242424242` succeeds, `4000000000000002` is declined,
        `4000000000000341` succeeds now and fails at renewal.
      parameters:
        - in: path
          name: sessionID
          required: true
          schema: {type: string}
      responses:
        '200':
          description: HTML card form
          content:
            text/html:
              schema: {type: string}
        '303':
          description: Already completed; redirected to the return page
        '404':
          description: Unknown session or sandbox not active
    post:
      summary: Submit the sandbox card form (non-production)
      description: >-
        Browser form POST (`card_number`, `exp_month`, `exp_year`, `cvc`,
        `name`, `action=pay|cancel`). On success the sandbox emits the same
        signed events a real provider would and redirects to the return page.
        Not an idempotent client command; the resulting events are deduplicated
        by the webhook ledger.
      parameters:
        - in: path
          name: sessionID
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {type: object}
      responses:
        '200':
          description: Form re-rendered with a validation or decline message
          content:
            text/html:
              schema: {type: string}
        '303':
          description: Redirect to the return page
        '404':
          description: Unknown session or sandbox not active
  /v1/billing/sandbox/subscriptions/{userID}/simulate:
    post:
      summary: Advance the sandbox renewal clock (non-production)
      description: >-
        Owner-only QA control for `PAYMENTS_PROVIDER=sandbox`. `renewal_paid`
        charges the next period, `renewal_failed` fails it (subscription goes
        `past_due`), `period_end` honours a pending cancel-at-period-end, and
        `refund` refunds the last settled charge. Each action is delivered as
        signed webhook events through the normal pipeline.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event: {type: string, enum: [renewal_paid, renewal_failed, period_end, refund, dispute_open, dispute_won, dispute_lost]}
      responses:
        '200':
          description: Updated subscription and recent payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  subscription: {$ref: '#/components/schemas/UserSubscription'}
                  payments:
                    type: array
                    items: {$ref: '#/components/schemas/BillingPayment'}
        '404':
          description: Sandbox not active or no sandbox subscription
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/billing/coexistence-matrix:
    get:
      summary: Get monetization coexistence matrix
      responses:
        '200':
          description: Coexistence matrix payload
          content:
            application/json:
              schema:
                type: object
                required: [coexistence_matrix]
                properties:
                  coexistence_matrix:
                    $ref: '#/components/schemas/BillingCoexistenceMatrix'
  /v1/billing/subscription/{userID}:
    get:
      summary: Get user billing subscription
      parameters:
        - in: path
          name: userID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User subscription payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscriptionResponse'
  /v1/billing/subscribe:
    post:
      summary: Subscribe user to billing plan (local activation only)
      description: >-
        Legacy provider-less activation that records a subscription and a
        settled payment without charging anything. Refused with 409
        `CHECKOUT_REQUIRED` semantics (error code `CONFLICT`) whenever a payment
        provider is configured, unless `BILLING_LOCAL_ACTIVATION_ENABLED=true`
        on a development stack. Real activation goes through
        `POST /v1/billing/checkout`.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: >-
            Client-generated key making the write repeat-safe. A retry with the
            same key, actor and route replays the original response and sets
            `X-Idempotent-Replay: true` instead of performing the work twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, plan_id]
              properties:
                user_id:
                  type: string
                plan_id:
                  type: string
                billing_cycle:
                  type: string
      responses:
        '200':
          description: Billing subscription accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscribeResponse'
  /v1/billing/payments/{userID}:
    get:
      summary: List user billing payments
      parameters:
        - in: path
          name: userID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User payment list payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPaymentsResponse'
  /v1/safety/report:
    post:
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
      summary: Report user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reported_user_id, reason]
              properties:
                reported_user_id:
                  type: string
                reason:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Report accepted
  /v1/moderation/appeals:
    get:
      summary: List moderation appeals for current user
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: string
        - in: query
          name: status
