  /v1/admin/safety/account-recovery:
    get:
      summary: List account-recovery requests for trust and safety review
      parameters:
        - in: query
          name: status
          schema: {type: string, enum: [open, code_issued, declined, expired]}
      responses:
        '200': {description: Account-recovery review queue}
        '401': {description: Authenticated operator role required}
        '503': {description: Durable recovery persistence is unavailable}
  /v1/admin/safety/account-recovery/{requestID}/resolve:
    post:
      summary: Resolve a recovery request after an out-of-band identity check
      description: |
        Declines the request or issues a display-once, short-lived recovery
        code. Issuing a code revokes all active sessions in the same
        transaction and records an immutable security event.
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: requestID
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, resolution_note]
              properties:
                action: {type: string, enum: [issue_recovery_code, decline]}
                identity_check:
                  type: string
                  enum: [verified_identity_match, account_detail_match, other]
                resolution_note: {type: string, minLength: 10, maxLength: 1000}
      responses:
        '200': {description: Resolution committed; a recovery code is returned once when issued}
        '400': {description: Invalid action, identity check, or resolution note}
        '401': {description: Authentication required}
        '403': {description: Trust-and-safety or administrator role required to issue a code}
        '404': {description: Recovery request not found}
        '409': {description: Recovery request is closed or the account cannot be recovered}
  /v1/admin/users/{userID}/suspend:
    post:
      summary: Suspend an account and revoke every active session
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
                days: {type: integer, minimum: 0}
      responses:
        '200': {description: Account suspended and sessions revoked atomically}
        '403': {description: Administrator role required}
  /v1/admin/users/{userID}/unsuspend:
