  /v1/chat/{matchID}/messages/{messageID}/gift/hide:
    post:
      summary: Hide a received gift from the receiver's chat
      description: >-
        Hides the linked gift only for its authenticated receiver. The sender's
        gift ledger and message history remain intact. Repeating the request is
        safe and leaves the gift hidden.
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: matchID
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: messageID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Gift hidden for the receiver
          content:
            application/json:
              schema:
                type: object
                required: [hidden, message_id, gift_send_id]
                properties:
                  hidden: {type: boolean, enum: [true]}
                  message_id: {type: string, format: uuid}
                  gift_send_id: {type: string, format: uuid}
        '401': {description: Valid bearer session required}
        '404': {description: Received gift not found for this member}
        '503': {description: Gift visibility persistence unavailable}
  /v1/chat/{matchID}/messages/{messageID}/gift/report:
    post:
      summary: Report and hide a received gift
      description: >-
        Creates one moderation case for the authenticated receiver and hides
        the gift immediately. Repeating a completed report returns the original
        report identifier without creating another case.
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: matchID
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: messageID
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [unwanted, harassment, sexual_content, scam, other]
                details:
                  type: string
                  maxLength: 500
      responses:
        '201': {description: Moderation case created and gift hidden}
        '200': {description: Existing moderation case returned}
        '400': {description: Invalid reason or details}
        '401': {description: Valid bearer session required}
        '404': {description: Received gift not found for this member}
        '503': {description: Gift reporting persistence unavailable}
