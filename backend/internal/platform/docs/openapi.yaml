          description: SOS alert committed with its response SLA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SOSAlertResponse'
  /v1/safety/sos/{userID}:
    get:
      summary: List the authenticated user's SOS alerts
      parameters:
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: SOS alert history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SOSAlertHistoryResponse'
  /v1/admin/moderation/reports:
    get:
      summary: List the authenticated operator's moderation queue
      responses:
        '200': {description: Moderation reports ordered by creation time}
        '403': {description: Administrator role required}
  /v1/admin/moderation/media:
    get:
      summary: List media awaiting authenticated operator review
      parameters:
        - in: query
          name: status
          schema: {type: string, enum: [review_required, provider_error], default: review_required}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200': {description: Oldest-first media review queue}
        '403': {description: Trust and safety operator role required}
  /v1/admin/moderation/media/{photoID}/decision:
    post:
      summary: Approve or reject a queued profile photo transactionally
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
        - in: path
          name: photoID
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approved, rejected]}
                reason: {type: string, description: Required for rejection}
      responses:
        '200': {description: Decision and immutable moderation event committed}
        '403': {description: Trust and safety operator role required}
  /v1/admin/moderation/media/{photoID}/content:
    get:
      summary: Stream quarantined media to an authenticated reviewer
      parameters:
        - in: path
          name: photoID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Original image bytes
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
            image/heic: {schema: {type: string, format: binary}}
        '403': {description: Trust and safety operator role required}
  /v1/admin/moderation/group-covers:
    get:
      summary: Group cover photos awaiting (or past) operator review
      description: pending (default, oldest first) lists covers the moderation provider sent to a human; approved lists live approved covers, newest first.
      parameters:
        - in: query
          name: status
          schema: {type: string, enum: [pending, approved], default: pending}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200': {description: "{items: [{cover_id, group_id, group_name, group_kind, owner_user_id, uploaded_by, status, reason, provider, mime_type, width_px, height_px, size_bytes, uploaded_at, content_url}], count, status}"}
        '403': {description: Moderator, trust and safety or admin role required}
  /v1/admin/moderation/group-covers/{coverID}/decision:
    post:
      summary: Approve or reject a pending group cover
      description: >-
        Approval shows the cover to everyone who can see the group. Rejection
        hides it at once, deletes the object and notifies the owner
        (group.cover.rejected). Repeating the same decision is a no-op; a cover
        that is no longer pending cannot be decided differently (409).
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
        - in: path
          name: coverID
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approved, rejected]}
                reason: {type: string, maxLength: 200}
      responses:
        '200': {description: "{cover_id, group_id, status}"}
        '400': {description: Unknown decision}
        '403': {description: Moderator, trust and safety or admin role required}
        '404': {description: Unknown cover}
        '409': {description: The cover is no longer waiting for review}
  /v1/admin/moderation/group-covers/{coverID}/content:
    get:
      summary: Stream a stored group cover to a reviewer
      parameters:
        - in: path
          name: coverID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Stored (re-encoded) image bytes, private no-store
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        '403': {description: Moderator, trust and safety or admin role required}
        '404': {description: Unknown cover or object already released}
  /v1/admin/moderation/reports/{reportID}/action:
