        '403':
          description: Not a member of this match or feature disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Match or plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Plan state conflict (DATE_PLAN_ALREADY_OPEN, DATE_PLAN_NOT_OPEN, DATE_PLAN_MATCH_INACTIVE, DATE_PLAN_CHECKIN_TOO_EARLY)
          content:
            application/json:
              schema:
