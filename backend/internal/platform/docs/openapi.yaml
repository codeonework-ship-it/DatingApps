        '200':
          description: File bytes
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            application/pdf: {schema: {type: string, format: binary}}
        '404': {description: Attachment not found or released}
  /v1/admin/support/dashboard:
    get:
      tags: [support]
      summary: SLA dashboard metrics (support roles; analyst read-only)
      parameters:
        - {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 365, default: 30}}
      responses:
        '200':
          description: Open workload, breaches, medians, CSAT and trends
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupportDashboard'}
        '403': {description: Operator role does not permit this action}
  /v1/admin/support/agents:
    get:
      tags: [support]
      summary: Operators who can be assigned tickets, with their open workload
      responses:
        '200':
          description: Assignable operators
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  agents:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
                        roles: {type: array, items: {type: string}}
                        open_assigned: {type: integer}
        '403': {description: Not a support operator}
  /v1/admin/support/canned-responses:
    get:
      tags: [support]
      summary: List canned responses (macros)
      parameters:
        - {name: include_inactive, in: query, schema: {type: string, enum: ['1']}}
      responses:
        '200':
          description: Canned responses, most used first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  canned_responses: {type: array, items: {$ref: '#/components/schemas/SupportCannedResponse'}}
    post:
      tags: [support]
      summary: Create a canned response
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: {type: string, minLength: 1, maxLength: 120}
                body: {type: string, minLength: 1, maxLength: 5000}
                category: {$ref: '#/components/schemas/SupportCategory'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/SupportCannedResponseEnvelope'}}}}
        '400': {description: Invalid title, body or category}
        '409': {description: SUPPORT_CANNED_EXISTS}
  /v1/admin/support/canned-responses/{responseID}:
    parameters:
      - {name: responseID, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [support]
      summary: Edit, recategorise, deactivate or reactivate a canned response
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {type: string, minLength: 1, maxLength: 120}
                body: {type: string, minLength: 1, maxLength: 5000}
                category: {type: string, nullable: true, description: Category key; null or empty clears}
                is_active: {type: boolean}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/SupportCannedResponseEnvelope'}}}}
        '400': {description: Invalid field}
        '404': {description: Canned response not found}
        '409': {description: SUPPORT_CANNED_EXISTS}
    delete:
      tags: [support]
      summary: Deactivate a canned response (kept for replies that used it)
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200': {description: Deactivated, content: {application/json: {schema: {$ref: '#/components/schemas/SupportCannedResponseEnvelope'}}}}
        '404': {description: Canned response not found}
  /v1/admin/growth/fraud-graph:
    get:
      summary: List review-only fraud graph signals
      responses:
        '200': {description: Fraud signals; automatic_enforcement is false}
  /v1/admin/growth/fraud-graph/{edgeID}/resolve:
    parameters:
      - {name: edgeID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Resolve a fraud signal without automatic member enforcement
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [dismissed, confirmed]}
      responses:
        '200': {description: Review decision stored; automatic_enforcement remains false}

  /v1/account/{userID}/dating-preferences:
    get:
      tags: [intentional-dating]
      summary: Read your dating rhythm
      description: >-
        Returns only the authenticated member’s preferences. Missing preferences are private by default. Expired availability is omitted.
      parameters:
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Current member-visible state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '400':
          description: Invalid choice, availability or identifier
        '401':
          description: Authentication required
        '403':
          description: Not authorized or feature disabled
        '404':
          description: Active match or requested resource not found
        '409':
          description: Stale revision, immutable answer or another open moment
        '503':
          description: Persistence or feature policy unavailable
    put:
      tags: [intentional-dating]
      summary: Save your dating rhythm
      description: >-
        Version must match the last read. Turning availability off erases saved windows. Both members must consent before an overlap is disclosed. Friend introductions require separate opt-in; photo and city sharing default off.
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatingPreferences'
      responses:
        '200':
          description: Current member-visible state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '400':
          description: Invalid choice, availability or identifier
        '401':
          description: Authentication required
        '403':
          description: Not authorized or feature disabled
        '404':
          description: Active match or requested resource not found
        '409':
          description: Stale revision, immutable answer or another open moment
        '503':
          description: Persistence or feature policy unavailable
  /v1/matches/{matchID}/connection:
    get:
      tags: [intentional-dating]
      summary: Read shared fit and chemistry
      description: >-
        Only active unblocked participants may read this. Reasons describe actual common preferences, overlap contains intersections only, and partner answers remain absent until both answer. Includes plan_revision for reconciliation. Never controls chat access.
      parameters:
        - in: path
          name: matchID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Current member-visible state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '400':
          description: Invalid choice, availability or identifier
        '401':
          description: Authentication required
        '403':
          description: Not authorized or feature disabled
        '404':
          description: Active match or requested resource not found
        '409':
          description: Stale revision, immutable answer or another open moment
        '503':
          description: Persistence or feature policy unavailable
  /v1/matches/{matchID}/moments:
    post:
      tags: [intentional-dating]
      summary: Start an optional chemistry moment
      description: >-
        Client UUID provides replay safety. One open moment per match, up to three new moments per match in a rolling 24 hours, seven-day expiry without a visible countdown.
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: matchID
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, prompt]
              properties:
                id: {type: string, format: uuid}
                prompt: {type: string, enum: [sunday, adventure, first_date]}
      responses:
        '200':
          description: Current member-visible state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '400':
          description: Invalid choice, availability or identifier
        '401':
          description: Authentication required
        '403':
          description: Not authorized or feature disabled
        '404':
          description: Active match or requested resource not found
        '409':
          description: Stale revision, immutable answer or another open moment
        '503':
          description: Persistence or feature policy unavailable
  /v1/matches/{matchID}/moments/{momentID}/answer:
    post:
      tags: [intentional-dating]
      summary: Answer a chemistry moment privately
      description: >-
        An answer is immutable; repeating the same answer is safe. Both answers are returned together only after both participants answer. There is no score or conversation gate.
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: matchID
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: momentID
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: {type: string, maxLength: 40, description: One of the options returned with the moment}
      responses:
        '200':
          description: Current member-visible state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '400':
          description: Invalid choice, availability or identifier
        '401':
          description: Authentication required
        '403':
          description: Not authorized or feature disabled
        '404':
          description: Active match or requested resource not found
        '409':
          description: Stale revision, immutable answer or another open moment
        '503':
          description: Persistence or feature policy unavailable
  /v1/matches/{matchID}/plans/{planID}/counter:
    post:
      tags: [intentional-dating]
      summary: Suggest a change to a plan
      description: >-
        Only the recipient of the current proposal may counter. Requires both date-plan and intentional-dating flags. Retains both participants and their existing sharing choices. A counterproposal requires explicit acceptance of its new version.
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: matchID
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: planID
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, window_start, window_end, venue_category]
              properties:
                expected_version: {type: integer, minimum: 0}
                window_start: {type: string, format: date-time}
                window_end: {type: string, format: date-time}
                venue_category: {type: string, enum: [coffee, walk, meal, activity, event, video_call, drinks, other]}
                venue_name: {type: string, maxLength: 120}
                venue_area: {type: string, maxLength: 120}
                note: {type: string, maxLength: 280}
                atmosphere_preferences:
                  type: array
                  maxItems: 3
                  items: {type: string, enum: [quiet, relaxed, lively, outdoors, indoors]}
                  description: Optional settings to enjoy. Omitted on a counterproposal preserves the current choices; an empty array clears them.
                accessibility_preferences:
                  type: array
                  maxItems: 6
                  items: {type: string, enum: [step_free, accessible_toilet, seating, low_noise, nearby_transit, captions]}
                  description: Optional functional requests shared only in the participants' plan. Not verified venue facilities, never added to friend updates. Omitted on a counterproposal preserves the current choices.
                shared_window:
                  type: object
                  required: [start, end]
                  properties:
                    start: {type: string, format: date-time}
                    end: {type: string, format: date-time}
                  description: Optional source of a selected suggestion. The proposed start/end must fit this window and a current intersection of both opted-in schedules; otherwise 409 SHARED_AVAILABILITY_CHANGED. Manual proposals omit this field and do not claim shared availability.
                budget_preference: {type: string, enum: [flexible, free, modest, treat], default: flexible}
      responses:
        '200':
          description: Current member-visible state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '400':
          description: Invalid choice, availability or identifier
        '401':
          description: Authentication required
        '403':
          description: Not authorized or feature disabled
        '404':
          description: Active match or requested resource not found
        '409':
          description: Stale revision or shared availability changed
        '503':
          description: Persistence or feature policy unavailable
  /v1/matches/{matchID}/plans/{planID}/sharing:
    parameters:
      - in: path
        name: matchID
        required: true
        schema: {type: string, format: uuid}
      - in: path
        name: planID
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [intentional-dating]
      summary: Read my own per-plan sharing choices and eligible trusted contacts
      description: Only a plan participant may read their own choices. No contact IDs are disclosed to the other participant. Gated by date_plans_enabled.
      responses:
        '200':
          description: Own contact_ids, eligible contacts (id/name), and optimistic version. Defaults to no contacts.
        '404': {description: Plan unavailable to this member}
    post:
      tags: [intentional-dating]
      summary: Explicitly replace my trusted contacts for this plan
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
      description: >-
        Starts private. Accepts only accepted, active, unblocked friends, excluding either date participant.
        Empty contact_ids withdraws sharing, including after an unmatch. Removes revoked feed/in-app copies and suppresses queued updates.
        Already delivered or in-flight device pushes cannot be recalled. Current plan details are shared with selected contacts on save.
        Legacy group_ids do not grant sharing access. Member messages and private date feedback are never included.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact_ids, expected_version]
              properties:
                contact_ids:
                  type: array
                  maxItems: 10
                  uniqueItems: true
                  items: {type: string, format: uuid}
                expected_version: {type: integer, minimum: 0}
      responses:
        '200': {description: Updated own sharing choices and incremented version}
        '400': {description: Invalid contacts or missing version}
        '403': {description: Recipient is not an eligible trusted friend}
        '404': {description: Plan unavailable to this member}
        '409': {description: Stale sharing version; reload before retrying}

  /v1/profile/{userID}/showcase:
    parameters:
      - in: path
        name: userID
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [intentional-dating]
      summary: Read a member's public chapters and wall photos for their profile
      description: Other members see items only when the owner opted in (showcase consent, default off), and only community chapters and wall-featured photos that are active, not under review and visible to the viewer (blocks, account state, community eligibility). Without consent the response is empty and reveals nothing; a block in either direction or an inactive account answers the same way (enabled false, no items). Owners always get a preview of what would show plus their consent. At most six of each. Responses are no-store.
      responses:
        '200':
          description: 'enabled (owner consent), chapters (id, title, excerpt, published_at, like_count, comment_count) and photos (theme entries)'
        '400': {description: Invalid profile id}
        '401': {description: Authentication required}
        '503': {description: Persistence unavailable}
  /v1/profile/{userID}/showcase/consent:
    parameters:
      - in: path
        name: userID
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [intentional-dating]
      summary: Read own showcase consent
      description: Owner only. Default false.
      responses:
        '200': {description: '{visible}'}
        '401': {description: Authentication required}
        '403': {description: Not the owner}
        '503': {description: Persistence unavailable}
    put:
      tags: [intentional-dating]
      summary: Choose whether public chapters and wall photos appear on own profile
      description: Owner only. Stored in user_settings.profile_showcase_visible (migration 130). Withdrawing consent hides the showcase from other members immediately.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visible]
              properties:
                visible: {type: boolean}
      responses:
        '200': {description: '{visible}'}
        '400': {description: visible must be a boolean}
        '401': {description: Authentication required}
        '403': {description: Not the owner}
        '503': {description: Persistence unavailable}
  /v1/profile/{userID}/stories:
    parameters:
      - in: path
        name: userID
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [intentional-dating]
      summary: Read optional profile stories
      description: Owners see private drafts and approved gallery choices. Other members see only explicitly published stories on a currently eligible, unblocked public profile. Current photo approval is rechecked. Responses are no-store.
      responses:
        '200':
          description: Stories, publication state, version and owner-only photo choices
        '401': {description: Authentication required}
        '403': {description: Feature disabled}
        '404': {description: Profile not visible}
        '503': {description: Persistence unavailable}
    put:
      tags: [intentional-dating]
      summary: Replace own profile stories and explicit publication consent
      description: Versioned atomic replacement, limited to three unique supported prompts and current approved photos belonging to the owner. Emits a metadata-only event in the transaction. Empty stories withdraw publication. Data is included in export and erased on account erasure.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stories, published, expected_version]
              properties:
                expected_version: {type: integer, minimum: 0}
                published: {type: boolean, default: false}
                stories:
                  type: array
                  maxItems: 3
                  items:
                    type: object
                    required: [prompt_id]
                    description: 'Send text (plain, older clients) or content (formatted, at most 40 blocks and 400 derived characters). Stories are returned with the same optional content.'
                    properties:
                      prompt_id: {type: string, enum: [little_joy, weekend, first_hello, learning, care]}
                      text: {type: string, minLength: 1, maxLength: 400, description: 'Plain text. When content is sent the server derives text from it and ignores this value'}
                      content: {$ref: '#/components/schemas/RichDocument'}
                      photo_id: {type: string, format: uuid}
                      photo_description: {type: string, minLength: 1, maxLength: 160, description: Required when photo_id is provided}
      responses:
        '200': {description: Updated owner view and incremented version}
        '400': {description: Invalid story or photo description}
        '401': {description: Authentication required}
        '403': {description: Not owner, photo not approved or feature disabled}
        '409': {description: Stale version; reread before retrying}
        '503': {description: Persistence unavailable}
  /v1/matches/{matchID}/voice-introductions:
    get:
      tags: [engagement]
      summary: Read approved private voice introductions with transcripts
      description: Latest 20 approved sent recordings for this active unblocked conversation. Both accounts must remain available. Contains no storage paths or playback grants. Playback uses the existing explicit play endpoint; signed media access rechecks the relationship on each request.
      parameters:
        - in: path
          name: matchID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Introductions array including readable member-written transcripts}
        '401': {description: Authentication required}
        '403': {description: Not a current participant, enforcement or feature disabled}
        '404': {description: Match unavailable}
        '503': {description: Persistence unavailable}
  /v1/introducer/connections:
    get:
      tags: [friends]
      summary: Read your scoped introduction permissions
      description: >-
        Both account types see only their own pending and active permissions.
        Includes the other person's name, permission status and preview choices;
        no profile, dating activity, answer or match outcome. Unavailable and
        blocked accounts are omitted. Remains readable when rollout is disabled.
      responses:
        '200': {description: Connections array with id, user_id, name, status (pending/active/paused), share_photo and share_city}
        '401': {description: Authentication required}
  /v1/introducer/invites:
    post:
      tags: [friends]
      summary: Create a one-use private invitation for an introducer
      description: >-
        Dating members only. Returns code and expires_at. Code expires in 48 hours
        and replaces previous unused codes. At most 10 per day. The code requests
        permission; it cannot authorize an introduction until the member approves
        the named introducer. Photo and city sharing default off. The returned
        code is not stored in command-response caches; only its digest is stored.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                share_photo: {type: boolean, default: false}
                share_city: {type: boolean, default: false}
      responses:
        '200': {description: Display-once code and expiry}
        '403': {description: Feature unavailable}
        '409': {description: Account not eligible}
        '429': {description: Daily invitation limit reached}
    delete:
      tags: [friends]
      summary: Cancel all your unused invitation codes
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      description: Existing permissions are unchanged. Available even when rollout is disabled.
      responses:
        '200': {description: Unused codes revoked}
  /v1/introducer/redeem:
    post:
      tags: [friends]
      summary: Request permission using a friend's invitation
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      description: >-
        Introducer accounts only, after terms acceptance. The same actor may replay
        redemption; another actor cannot reuse the code. Does not create a general
        friendship or expose date-plan feeds. At most 20 current permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, minLength: 43, maxLength: 43}
      responses:
        '200': {description: Permission request recorded; member approval still required}
        '403': {description: Account type, terms or feature restriction}
        '409': {description: Expired, revoked, reused or unavailable invitation}
        '429': {description: Circle limit reached}
  /v1/introducer/connections/{consentID}/approve:
    post:
      tags: [friends]
      summary: Approve this named introducer
      description: >-
        Only the dating member may approve. Explicitly enables friend introductions
        and grants this introducer permission with the invitation's preview choices.
        New proposals revalidate consent, publication, pauses, blocks and compatibility.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
        - in: path
          name: consentID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Permission active}
        '409': {description: Permission unavailable or caller not the member}
  /v1/introducer/connections/{consentID}:
    delete:
      tags: [friends]
      summary: Withdraw a permission or decline a request
      description: >-
        Either participant may revoke; revocation closes open introductions and
        prevents further preview access. Existing mutual matches remain independent.
        Available even when introductions are disabled. Revocation is idempotent.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
        - in: path
          name: consentID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Permission revoked}
        '409': {description: Permission unavailable or caller not a participant}
