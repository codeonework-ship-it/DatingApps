                        reason: {type: string}
                        created_by: {type: string}
                        created_at: {type: string, format: date-time}
        '403': {description: Requires the admin role}
    post:
      tags: [analytics]
      summary: Flag an account as a test account so every analytics report excludes it (admin only)
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_id, reason]
              properties:
                member_id: {type: string, format: uuid}
                reason: {type: string, minLength: 3, maxLength: 200}
      responses:
        '200':
          description: Flag saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  member_id: {type: string, format: uuid}
                  note: {type: string}
        '400': {description: Invalid member id or reason}
        '403': {description: Requires the admin role}
        '404': {description: Member not found}
  /v1/admin/analytics/excluded-accounts/{memberID}:
    delete:
      tags: [analytics]
      summary: Remove an analytics test-account flag (admin only)
      parameters:
        - {in: path, name: memberID, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200':
          description: Flag removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  member_id: {type: string, format: uuid}
        '400': {description: Invalid member id}
        '403': {description: Requires the admin role}
components:
  parameters:
    Idempotency-Key:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: >-
        Client-generated retry key. Reusing the same key for the same actor,
        method, route, query, and request payload replays the original response
        without repeating the authenticated command. Reusing it for a different
        payload returns `IDEMPOTENCY_KEY_CONFLICT`.
    BusinessSince:
      in: query
      name: since
      required: false
      schema: {type: string}
      description: Window start (inclusive), RFC3339 or YYYY-MM-DD in the reporting time zone. Default depends on the report (30 days, or 12 months month-aligned).
    BusinessUntil:
      in: query
      name: until
      required: false
      schema: {type: string}
      description: Window end, RFC3339 (exclusive) or YYYY-MM-DD (inclusive day). Windows are limited to 1,100 days and 400 buckets.
    BusinessTZ:
      in: query
      name: tz
      required: false
      schema: {type: string, default: UTC, example: Asia/Kolkata}
      description: IANA reporting time zone for windows and buckets.
    BusinessMode:
      in: query
      name: mode
      required: false
      schema: {type: string, enum: [live, sandbox, all], default: live}
      description: >-
        live excludes sandbox (provider sandbox, Stripe test keys, livemode=false)
        and local rows; sandbox shows only sandbox rows; all is live + sandbox.
        Local activations are never revenue.
    BusinessBucket:
      in: query
      name: bucket
      required: false
      schema: {type: string, enum: [day, week, month]}
      description: Trend bucket (calendar day, ISO week, month) in the reporting time zone.
    BusinessFormat:
      in: query
      name: format
      required: false
      schema: {type: string, enum: [json, csv], default: json}
      description: csv returns one table (see `table`) as text/csv with a Content-Disposition attachment; suppressed counts render as "<5".
    BusinessTable:
      in: query
      name: table
      required: false
      schema: {type: string}
      description: CSV table name; the JSON response lists the available names in `tables`. Defaults to the first.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    SupportCategory:
      type: string
      description: Member-facing ticket category. safety_harassment and verification go to the trust_safety team; payments_billing to billing; privacy_data to privacy; technical to technical; the rest to general.
      enum: [account_login, verification, payments_billing, safety_harassment, matches_chat, technical, feature_request, privacy_data, other]
    SupportStatus:
      type: string
      description: new (just raised), open (being worked), pending_member (waiting on the member; resolution clock paused), on_hold, resolved (auto-closes after 7 days without a member reply), closed (member may reopen for 14 days).
      enum: [new, open, pending_member, on_hold, resolved, closed]
    SupportAttachment:
      type: object
      required: [id, filename, content_type, size_bytes]
      properties:
        id: {type: string, format: uuid}
        filename: {type: string}
        content_type: {type: string, enum: [image/jpeg, image/png, application/pdf]}
        size_bytes: {type: integer}
        url: {type: string, description: Authorised download path (member or operator variant)}
    SupportSatisfaction:
      type: object
      properties:
        rating: {type: integer, minimum: 1, maximum: 5}
        comment: {type: string}
        rated_at: {type: string, format: date-time}
    SupportTicket:
      type: object
      description: A ticket as its member sees it. Never carries priority, assignee, tags or internal notes.
      required: [id, reference, category, subject, status, created_at, can_reply, can_close, can_reopen, can_rate]
      properties:
        id: {type: string, format: uuid}
        reference: {type: string, example: CN-2026-000123}
        category: {$ref: '#/components/schemas/SupportCategory'}
        subject: {type: string}
        status: {$ref: '#/components/schemas/SupportStatus'}
        channel: {type: string, enum: [app, website, email]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_activity_at: {type: string, format: date-time}
        resolved_at: {type: string, format: date-time, nullable: true}
        closed_at: {type: string, format: date-time, nullable: true}
        reopen_until: {type: string, format: date-time, nullable: true}
        message_count: {type: integer}
        unread_count: {type: integer, description: Support replies after the member last opened the ticket}
        last_message_preview: {type: string}
        last_message_author: {type: string, enum: [member, agent, system], nullable: true}
        can_reply: {type: boolean}
        can_close: {type: boolean}
        can_reopen: {type: boolean}
        can_rate: {type: boolean}
        satisfaction:
          nullable: true
          allOf: [{$ref: '#/components/schemas/SupportSatisfaction'}]
        merged_into_reference: {type: string, nullable: true}
    SupportMessage:
      type: object
      required: [id, author, body, created_at, attachments]
      properties:
        id: {type: string, format: uuid}
        author: {type: string, enum: [member, agent, system]}
        author_name: {type: string, nullable: true, description: '"Connect Support" for agent and system messages; null for the member'}
        body: {type: string}
        created_at: {type: string, format: date-time}
        attachments: {type: array, items: {$ref: '#/components/schemas/SupportAttachment'}}
    SupportTicketEnvelope:
      type: object
      required: [success, ticket]
      properties:
        success: {type: boolean}
        ticket: {$ref: '#/components/schemas/SupportTicket'}
    SupportTicketThread:
      type: object
      required: [success, ticket, messages]
      properties:
        success: {type: boolean}
        ticket: {$ref: '#/components/schemas/SupportTicket'}
        messages: {type: array, items: {$ref: '#/components/schemas/SupportMessage'}}
        duplicate: {type: boolean}
    SupportAdminTicket:
      type: object
      required: [id, reference, category, subject, status, priority, team, channel, requester, sla]
      properties:
        id: {type: string, format: uuid}
        reference: {type: string}
        category: {$ref: '#/components/schemas/SupportCategory'}
        subject: {type: string}
        status: {$ref: '#/components/schemas/SupportStatus'}
        priority: {type: string, enum: [low, normal, high, urgent]}
        team: {type: string, enum: [general, trust_safety, billing, privacy, technical]}
        channel: {type: string, enum: [app, website, email]}
        requester:
          type: object
          properties:
            kind: {type: string, enum: [member, contact]}
            member_id: {type: string, format: uuid, nullable: true}
            display_name: {type: string}
            username: {type: string, nullable: true}
            email: {type: string, nullable: true, description: Website tickets only}
        assignee:
          type: object
          nullable: true
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
        tags: {type: array, items: {type: string}}
        app_version: {type: string, nullable: true}
        platform: {type: string, nullable: true}
        os_version: {type: string, nullable: true}
        device_model: {type: string, nullable: true}
        locale: {type: string, nullable: true}
        client_error_issue_id: {type: string, format: uuid, nullable: true}
        first_response_due_at: {type: string, format: date-time}
        resolution_due_at: {type: string, format: date-time}
        first_responded_at: {type: string, format: date-time, nullable: true}
        resolved_at: {type: string, format: date-time, nullable: true}
        closed_at: {type: string, format: date-time, nullable: true}
        sla:
          type: object
          properties:
            state: {type: string, enum: [ok, at_risk, breached, paused, met]}
            first_response: {type: string, enum: [ok, at_risk, breached, met]}
            resolution: {type: string, enum: [ok, at_risk, breached, paused, met]}
        awaiting_agent: {type: boolean, description: The requester wrote last}
        satisfaction:
          nullable: true
          allOf: [{$ref: '#/components/schemas/SupportSatisfaction'}]
        merged_into:
          type: object
          nullable: true
          properties:
            id: {type: string, format: uuid}
            reference: {type: string}
        message_count: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_activity_at: {type: string, format: date-time}
    SupportAdminTicketEnvelope:
      type: object
      required: [success, ticket]
      properties:
        success: {type: boolean}
        ticket: {$ref: '#/components/schemas/SupportAdminTicket'}
    SupportAdminMessage:
      type: object
      properties:
        id: {type: string, format: uuid}
        author_kind: {type: string, enum: [member, contact, agent, system]}
        author_id: {type: string, format: uuid, nullable: true}
        author_name: {type: string}
        visibility: {type: string, enum: [public, internal]}
        body: {type: string}
        created_at: {type: string, format: date-time}
        canned_response_id: {type: string, format: uuid, nullable: true}
        attachments: {type: array, items: {$ref: '#/components/schemas/SupportAttachment'}}
    SupportTicketEvent:
      type: object
      properties:
        id: {type: integer}
        event_type: {type: string, example: status_changed}
        actor_kind: {type: string, enum: [member, contact, agent, system]}
        actor_id: {type: string, format: uuid, nullable: true}
        actor_name: {type: string}
        from_value: {type: string, nullable: true}
        to_value: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
    SupportMemberContext:
      type: object
      description: The minimum an agent needs; no profile content, messages or location.
      properties:
        member_id: {type: string, format: uuid}
        name: {type: string}
        username: {type: string}
        account_status: {type: string, enum: [active, deactivated, suspended, banned, deletion_pending, erased]}
        joined_at: {type: string, format: date-time}
        verification_status: {type: string}
        reports_against_90d: {type: integer}
        open_reports_against: {type: integer}
        reports_filed_90d: {type: integer}
        tickets_total: {type: integer}
    SupportCannedResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        body: {type: string, description: 'May use {{member_name}}, {{reference}} and {{agent_name}}'}
        category: {type: string, nullable: true}
        is_active: {type: boolean}
        usage_count: {type: integer}
        updated_at: {type: string, format: date-time}
    SupportCannedResponseEnvelope:
      type: object
      properties:
        success: {type: boolean}
        canned_response: {$ref: '#/components/schemas/SupportCannedResponse'}
    SupportDashboard:
      type: object
      properties:
        success: {type: boolean}
        window_days: {type: integer}
        open_by_status: {type: object, additionalProperties: {type: integer}}
        open_by_priority: {type: object, additionalProperties: {type: integer}}
        open_by_team: {type: object, additionalProperties: {type: integer}}
        breaches:
          type: object
          properties:
            first_response: {type: integer}
            resolution: {type: integer}
            at_risk: {type: integer}
        median_first_response_minutes: {type: number, nullable: true}
        median_resolution_minutes: {type: number, nullable: true}
        csat:
          type: object
          properties:
            average: {type: number, nullable: true}
            responses: {type: integer}
            distribution: {type: object, additionalProperties: {type: integer}}
        daily:
          type: array
          items:
            type: object
            properties:
              day: {type: string, format: date}
              created: {type: integer}
              resolved: {type: integer}
        by_category:
          type: array
          items:
            type: object
            properties:
              category: {type: string}
              open: {type: integer}
              created: {type: integer}
        safety:
          type: object
          description: Safety & harassment tickets (Trust & Safety SLA view)
          properties:
            open: {type: integer}
            breached: {type: integer}
            at_risk: {type: integer}
    RichDocument:
      type: object
      description: 'Formatted chapter or story. Never HTML. One block per line of the derived plain text (blocks joined by a newline; bullet adds "• ", numbered adds "N. ", divider is "* * *"). Unknown keys, types, marks or styles are rejected. See documents/RICH_TEXT_WRITING_STYLES_2026-10-01.md.'
      required: [version, blocks]
      additionalProperties: false
      properties:
        version: {type: integer, enum: [1]}
        style: {type: string, enum: [classic, modern, journal, typewriter, poetic], default: modern, description: Writing style chosen by the author; maps to bundled fonts}
        blocks:
          type: array
          maxItems: 400
          items:
            type: object
            required: [type]
            additionalProperties: false
            properties:
              type: {type: string, enum: [paragraph, heading, subheading, quote, bullet, numbered, divider, callout]}
              align: {type: string, enum: [start, center, end], default: start}
              spans:
                type: array
                maxItems: 200
                description: Empty for divider blocks and blank lines
                items:
                  type: object
                  required: [text]
                  additionalProperties: false
                  properties:
                    text: {type: string, description: 'Literal text without line breaks or control characters; always rendered as text'}
                    marks:
                      type: array
                      uniqueItems: true
                      items: {type: string, enum: [bold, italic, underline, strikethrough, highlight, link]}
                    href: {type: string, maxLength: 2048, pattern: '^https://', description: Required with (and only with) the link mark; absolute https URL without credentials}
    ClientErrorReport:
      type: object
      required: [install_id, events]
      properties:
        install_id: {type: string, pattern: '^[A-Za-z0-9_-]{16,64}$', description: Random per-install id; stored only as a sha256 hash}
        events:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: '#/components/schemas/ClientErrorEvent'}
    ClientErrorEvent:
      type: object
      required: [error_type, app_version, platform]
      properties:
        fingerprint: {type: string, maxLength: 128, description: Advisory; the server computes its own}
        error_type: {type: string, maxLength: 120}
        message: {type: string, maxLength: 1000}
        stack: {type: string, maxLength: 8000, description: First 50 lines kept}
        fatal: {type: boolean}
        handled: {type: boolean}
        source: {type: string, enum: [flutter, platform, zone, logger, unknown]}
        app_version: {type: string, pattern: '^[0-9A-Za-z][0-9A-Za-z.+-]{0,31}$'}
        build_number: {type: string, maxLength: 16}
        platform: {type: string, enum: [android, ios, web, macos, windows, linux]}
        os_version: {type: string, maxLength: 64}
        device_class: {type: string, enum: [phone, tablet, desktop, web, unknown]}
        locale: {type: string, maxLength: 16}
        screen: {type: string, maxLength: 120, description: Route template; ids are stripped}
        breadcrumbs:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              at: {type: string, format: date-time}
              category: {type: string, enum: [navigation, api, lifecycle, ui]}
              message: {type: string, maxLength: 200}
        occurred_at: {type: string, format: date-time, description: Events older than 7 days are dropped}
    ClientErrorIssue:
      type: object
      properties:
        id: {type: string, format: uuid}
        fingerprint: {type: string}
        error_type: {type: string}
        title: {type: string}
        culprit: {type: string}
        status: {type: string, enum: [open, resolved, ignored]}
        fatal: {type: boolean}
        regressed: {type: boolean}
        regression_count: {type: integer}
        occurrence_count: {type: integer}
        affected_users: {type: integer, description: Distinct installs that reported the issue}
        platforms: {type: array, items: {type: string}}
        versions: {type: array, items: {type: string}, description: Up to 10 app versions, most recent first}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        resolved_at: {type: string, format: date-time, nullable: true}
        resolved_in_version: {type: string, nullable: true}
        status_changed_at: {type: string, format: date-time, nullable: true}
        status_changed_by: {type: string, format: uuid, nullable: true}
        status_note: {type: string, nullable: true}
        reopened_at: {type: string, format: date-time, nullable: true}
    ClientErrorOccurrence:
      type: object
      properties:
        id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        app_version: {type: string}
        build_number: {type: string}
        platform: {type: string}
        os_version: {type: string}
        device_class: {type: string}
        locale: {type: string}
        screen: {type: string}
        source: {type: string}
        message: {type: string}
        stack: {type: string}
        breadcrumbs:
          type: array
          items:
            type: object
            properties:
              at: {type: string, format: date-time}
              category: {type: string}
              message: {type: string}
        fatal: {type: boolean}
        handled: {type: boolean}
        signed_in: {type: boolean}
    EconomyFraudCaseList:
      type: object
      required: [cases, count, status]
      properties:
        cases: {type: array, items: {type: object}}
        count: {type: integer, minimum: 0}
        status: {type: string}
    EconomyFraudRuleList:
      type: object
      required: [rules, count]
      properties:
        rules: {type: array, items: {type: object}}
        count: {type: integer, minimum: 0}
    EconomyFraudRuleUpdate:
      type: object
      required: [trigger_value, window_seconds, response_action, lock_seconds, severity, enabled]
      properties:
        trigger_value: {type: integer, minimum: 1}
        window_seconds: {type: integer, minimum: 60, maximum: 2678400}
        response_action: {type: string, enum: [warn, throttle, temporary_lock]}
        lock_seconds: {type: integer, minimum: 0, maximum: 604800}
        severity: {type: string, enum: [low, medium, high, critical]}
        enabled: {type: boolean}
    LevelDefinition:
      type: object
      required: [level, name, threshold_xp, trust_gate, reward_summary]
      properties:
        level: {type: integer, minimum: 1, maximum: 10}
        name: {type: string}
        threshold_xp: {type: integer, minimum: 0}
        trust_gate: {type: boolean}
        reward_summary: {type: string}
    LevelReward:
      type: object
      required: [reward_key, level, name, description, reward_type, payload, trust_required, claimed]
      properties:
        reward_key: {type: string}
        level: {type: integer}
        name: {type: string}
        description: {type: string}
        reward_type: {type: string, enum: [cosmetic, visibility, feature, prompt_pack]}
        payload: {type: object}
        trust_required: {type: boolean}
        claimed: {type: boolean}
        claim_id: {type: string, format: uuid, nullable: true}
    ProgressionState:
      type: object
      required: [user_id, total_xp, current_level, level_name, progress_percent, projection_lag_seconds, levels, rewards]
      properties:
        user_id: {type: string, format: uuid}
        total_xp: {type: integer, minimum: 0}
        current_level: {type: integer, minimum: 1, maximum: 10}
        level_name: {type: string}
        current_level_xp: {type: integer, minimum: 0}
        next_level_xp: {type: integer, nullable: true}
        progress_percent: {type: number, minimum: 0, maximum: 100}
        trust_gate_satisfied: {type: boolean}
        progression_frozen: {type: boolean}
        version: {type: integer, format: int64}
        projected_at: {type: string, format: date-time}
        projection_lag_seconds: {type: number, minimum: 0}
        levels: {type: array, items: {$ref: '#/components/schemas/LevelDefinition'}}
        rewards: {type: array, items: {$ref: '#/components/schemas/LevelReward'}}
    ProgressionResponse:
      type: object
      required: [progression]
      properties:
        progression: {$ref: '#/components/schemas/ProgressionState'}
        correlation_id: {type: string}
    XPLedgerEntry:
      type: object
      required: [sequence, event_id, source, awarded_xp, multiplier, occurred_at, metadata]
      properties:
        sequence: {type: integer, format: int64}
        event_id: {type: string, format: uuid}
        source: {type: string}
        awarded_xp: {type: integer}
        multiplier: {type: number}
        occurred_at: {type: string, format: date-time}
        metadata: {type: object}
    XPLedgerResponse:
      type: object
      required: [entries, count]
      properties:
        entries: {type: array, items: {$ref: '#/components/schemas/XPLedgerEntry'}}
        count: {type: integer, minimum: 0}
        correlation_id: {type: string}
    RewardClaimRequest:
      type: object
      required: [reward_key]
      properties: {reward_key: {type: string}}
    RewardClaim:
      type: object
      required: [id, reward_key, level, claimed_at, was_duplicate]
      properties:
        id: {type: string, format: uuid}
        reward_key: {type: string}
        level: {type: integer}
        claimed_at: {type: string, format: date-time}
        was_duplicate: {type: boolean}
    RewardClaimResponse:
      type: object
      required: [claim]
      properties:
        claim: {$ref: '#/components/schemas/RewardClaim'}
        correlation_id: {type: string}
    XPSourcePolicy:
      type: object
      required: [source, display_name, base_xp, daily_xp_cap, daily_event_cap, cooldown_seconds, decay_multipliers, enabled]
      properties:
        source: {type: string}
        display_name: {type: string}
        base_xp: {type: integer}
        daily_xp_cap: {type: integer}
        daily_event_cap: {type: integer}
        cooldown_seconds: {type: integer}
        decay_multipliers: {type: array, items: {type: number}}
        enabled: {type: boolean}
        updated_at: {type: string, format: date-time}
    ProgressionExperiment:
      type: object
      required: [key, name, status, rollout_stage, rollout_percent, variants, incident_response_minutes]
      properties:
        key: {type: string}
        name: {type: string}
        status: {type: string, enum: [draft, active, paused, completed]}
        rollout_stage: {type: string, enum: [draft, dogfood, five_percent, twenty_five_percent, general_availability]}
        rollout_percent: {type: integer, enum: [0, 1, 5, 25, 100]}
        variants: {type: object}
        safety_stop_owner: {type: string, nullable: true}
        incident_response_minutes: {type: integer, minimum: 1, maximum: 60}
        last_safety_review_at: {type: string, format: date-time, nullable: true}
        stage_evidence_uri: {type: string, nullable: true}
        stage_started_at: {type: string, format: date-time, nullable: true}
        updated_at: {type: string, format: date-time}
    ProgressionAdminResponse:
      type: object
      required: [policies, experiments, fraud_rules, metrics]
      properties:
        policies: {type: array, items: {$ref: '#/components/schemas/XPSourcePolicy'}}
        experiments: {type: array, items: {$ref: '#/components/schemas/ProgressionExperiment'}}
        fraud_rules: {type: array, items: {$ref: '#/components/schemas/ProgressionFraudRule'}}
        metrics:
          type: object
          required: [users, total_xp, avg_level, projection_lag_seconds]
          properties:
            users: {type: integer}
            total_xp: {type: integer}
            avg_level: {type: number}
            projection_lag_seconds: {type: number}
            queue_depth: {type: integer}
            processing: {type: integer}
            dead_letters: {type: integer}
            oldest_pending_age_seconds: {type: number}
            completion_p95_seconds: {type: number}
            open_fraud_cases: {type: integer}
            cap_denials_15m: {type: integer}
        correlation_id: {type: string}
    XPPolicyUpdateRequest:
      type: object
      properties:
        base_xp: {type: integer, minimum: 0, maximum: 500}
        daily_xp_cap: {type: integer, minimum: 0, maximum: 300}
        daily_event_cap: {type: integer, minimum: 1, maximum: 100}
        cooldown_seconds: {type: integer, minimum: 0, maximum: 86400}
        enabled: {type: boolean}
    ProgressionFraudCase:
      type: object
      required: [id, user_id, username, rule_code, severity, status, evidence, created_at]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        username: {type: string}
        rule_code: {type: string}
        severity: {type: string, enum: [low, medium, high, critical]}
        status: {type: string, enum: [open, reviewing, dismissed, confirmed]}
        evidence: {type: object}
        created_at: {type: string, format: date-time}
    ProgressionFraudResponse:
      type: object
      required: [cases, count]
      properties:
        cases: {type: array, items: {$ref: '#/components/schemas/ProgressionFraudCase'}}
        count: {type: integer, minimum: 0}
        correlation_id: {type: string}
    FraudResolutionRequest:
      type: object
      required: [status, resolution]
      properties:
        status: {type: string, enum: [dismissed, confirmed]}
        resolution: {type: string, minLength: 1}
    ProgressionFraudRule:
      type: object
      required: [rule_code, rejected_attempt_threshold, window_seconds, severity, response_action, enabled, review_sla_minutes, tuning_note]
      properties:
        rule_code: {type: string}
        rejected_attempt_threshold: {type: integer, minimum: 2, maximum: 20}
