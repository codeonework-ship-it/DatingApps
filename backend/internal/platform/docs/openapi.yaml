  /v1/client/errors:
    post:
      tags: [client-errors]
      security: [{}, {bearerAuth: []}]
      summary: Report app crashes and errors (self-hosted crash reporting)
      description: >-
        Accepts a batch of 1-20 scrubbed error events from the app. The bearer
        session is optional: signed-out screens report anonymously. Reports are
        never linked to an account; the random install id is stored only as a
        hash. The server re-scrubs every text field (emails, phone numbers,
        tokens, ids, IPs, query strings), computes its own grouping
        fingerprint, caps stored occurrences per issue and keeps them 90 days.
        Rate limits apply per install, per account (signed in) or per IP and
        globally (signed out). Not idempotent-keyed: duplicates are absorbed by
        server-side grouping and crash-loop suppression.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientErrorReport'}
      responses:
        '202':
          description: Batch processed; invalid or stale events are dropped individually
          content:
            application/json:
              schema:
                type: object
                required: [success, accepted, dropped]
                properties:
                  success: {type: boolean}
                  accepted: {type: integer, minimum: 0}
                  dropped: {type: integer, minimum: 0}
        '400': {description: Malformed report, invalid install_id or wrong batch size; do not retry}
        '413': {description: Report larger than 64 KB; do not retry}
        '429':
          description: Rate limited; keep the events and retry after the given delay
          headers:
            Retry-After: {schema: {type: integer, minimum: 1}, description: Seconds to wait}
        '503': {description: Storage unavailable; retry with backoff}
  /v1/admin/client-errors:
    get:
      tags: [client-errors]
      summary: List client error issues (admin, ops_admin; analyst read-only)
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [open, resolved, ignored, all], default: open}}
        - {name: platform, in: query, schema: {type: string, enum: [android, ios, web, macos, windows, linux]}}
        - {name: version, in: query, schema: {type: string, maxLength: 32}}
        - {name: fatal, in: query, schema: {type: boolean}}
        - {name: sort, in: query, schema: {type: string, enum: [last_seen, count, users], default: last_seen}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Issues matching the filters, newest activity first by default
          content:
            application/json:
              schema:
                type: object
                required: [success, issues, total, summary]
                properties:
                  success: {type: boolean}
                  issues: {type: array, items: {$ref: '#/components/schemas/ClientErrorIssue'}}
                  total: {type: integer}
                  limit: {type: integer}
                  offset: {type: integer}
                  summary:
                    type: object
                    properties:
                      open: {type: integer}
                      resolved: {type: integer}
                      ignored: {type: integer}
                      fatal_open: {type: integer}
        '400': {description: Unknown filter value}
        '403': {description: Operator role does not permit this action}
  /v1/admin/client-errors/{issueID}:
    parameters:
      - {name: issueID, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [client-errors]
      summary: Read a client error issue with its versions and most recent occurrences
      responses:
        '200':
          description: Issue, per-version counts and up to 20 recent occurrences
          content:
            application/json:
              schema:
                type: object
                required: [success, issue, versions, occurrences]
                properties:
                  success: {type: boolean}
                  issue: {$ref: '#/components/schemas/ClientErrorIssue'}
                  versions:
                    type: array
                    items:
                      type: object
                      properties:
                        app_version: {type: string}
                        platform: {type: string}
                        occurrences: {type: integer}
                        first_seen_at: {type: string, format: date-time}
                        last_seen_at: {type: string, format: date-time}
                  occurrences: {type: array, items: {$ref: '#/components/schemas/ClientErrorOccurrence'}}
        '404': {description: Issue not found}
  /v1/admin/client-errors/{issueID}/status:
    parameters:
      - {name: issueID, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [client-errors]
      summary: Resolve, ignore or reopen a client error issue (admin, ops_admin)
      description: >-
        A resolved issue reopens automatically (regressed=true) when a version
        at or above resolved_in_version reports it again, or — without a fix
        version — when a version that had not reported it before resolution
        does. Ignored issues keep counting but store no new occurrences.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [open, resolved, ignored]}
                resolved_in_version: {type: string, maxLength: 32, description: Only with status resolved}
                note: {type: string, maxLength: 500}
      responses:
        '200':
          description: Updated issue
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  issue: {$ref: '#/components/schemas/ClientErrorIssue'}
        '400': {description: Invalid status, version or note}
        '404': {description: Issue not found}
  /v1/admin/analytics/kpis:
    get:
      tags: [analytics]
      summary: "KPI summary (DAU, WAU, MAU, stickiness, new members, weekly plans kept per active member, women's good-day rate, safety rates) with the same window one week earlier"
      parameters:
      - {in: query, name: from, schema: {type: string, format: date}, description: First UTC day (default depends on the report)}
      - {in: query, name: to, schema: {type: string, format: date}, description: Last UTC day (default the latest built snapshot day)}
      - {in: query, name: gender, schema: {type: string, enum: [female, male, other, unknown]}}
      - {in: query, name: city, schema: {type: string, maxLength: 100}, description: Matched case-insensitively against the profile city}
      - {in: query, name: age_band, schema: {type: string, enum: ['18-24', '25-29', '30-34', '35-44', '45+', unknown]}}
      - {in: query, name: account_age_band, schema: {type: string, enum: [day_0, days_1_6, days_7_29, days_30_89, days_90_plus, unknown]}}
      - {in: query, name: level_band, schema: {type: string, enum: [L1-L3, L4-L7, L8-L10]}}
      - {in: query, name: format, schema: {type: string, enum: [json, csv]}, description: csv streams one table as text/csv with suppressed cells written as <5}
      - {in: query, name: table, schema: {type: string}, description: Which table to export as CSV when the report has several}
      - {in: query, name: as_of, schema: {type: string, format: date}, description: Alias of to}
      responses:
        '200':
          description: Report tables. Counts 1-4 and ratios or medians built on them are null and listed in the row's suppressed keys.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  report: {type: string}
                  from: {type: string, format: date}
                  to: {type: string, format: date}
                  segments:
                    type: object
                    additionalProperties: {type: string}
                  meta:
                    type: object
                    additionalProperties:
                      oneOf:
                        - {type: string}
                        - {type: number}
                        - {type: integer}
                        - {type: object, additionalProperties: {type: string}}
                  tables:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        columns:
                          type: array
                          items:
                            type: object
                            properties:
                              key: {type: string}
                              label: {type: string}
                              kind: {type: string, enum: [dimension, count, ratio, median, number]}
                              unit: {type: string}
                        rows:
                          type: array
                          items:
                            type: object
                            properties:
                              suppressed: {type: array, items: {type: string}}
                            additionalProperties:
                              oneOf:
                                - {type: string}
                                - {type: number}
                                - {type: 'null'}
