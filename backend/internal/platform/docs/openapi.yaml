  /v1/blog/posts:
    get:
      tags: [blog]
      summary: List the actor's chapters or accessible friends and community chapters
      description: Active adult dating members only. Private drafts are owner-only. Friends means accepted friendship, not a match. Community readers and authors need complete profiles and two approved profile photos. Blocks, suspensions, deactivation and audience changes apply to every read. No public-web access. Returns at most 20 posts and next_cursor; responses are private no-store.
      parameters:
        - {in: query, name: scope, schema: {type: string, enum: [mine, friends, community, top, subscriptions], default: community}, description: 'top ranks community chapters from the last 30 days by likes, approved comments then unique views (20, no paging); subscriptions lists chapters from writers the member follows'}
        - {in: query, name: topic, schema: {type: string, maxLength: 32}, description: Optional topic slug filter for any scope}
        - {in: query, name: author_id, schema: {type: string, format: uuid}}
        - {in: query, name: before, schema: {type: string, format: uuid}, description: next_cursor from previous page}
      responses:
        '200': {description: Posts with approved photo IDs and alt text, plus next_cursor}
        '400': {description: Invalid scope or cursor}
        '401': {description: Authentication required}
        '403': {description: Feature disabled or account ineligible}
        '503': {description: Persistence unavailable}
  /v1/blog/posts/{postID}:
    parameters:
      - {in: path, name: postID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [blog]
      summary: Read an accessible chapter and approved photo references
      responses:
        '200': {description: 'Post including author, title, body, content (formatted RichDocument, or null for plain-text chapters; body is always its plain text), audience, invitation, version and photos'}
        '401': {description: Authentication required}
        '404': {description: Post absent, deleted or not accessible to actor}
    put:
      tags: [blog]
      summary: Save or publish an owned chapter using a stable client UUID
      description: Create with expected_version zero, edit with the returned version. Exact lost-success retries return the saved representation. Concurrent stale edits return 409. At most 100 active chapters per author. Published chapters require both title and body. State and metadata-only outbox events commit together. No private prose or storage paths in events.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, title, audience]
              description: 'Send body (plain text) or content (formatted). With content the stored body is derived on the server and the sent body is ignored; a body-only save from an older client stores a plain-text chapter and clears earlier formatting.'
              properties:
                expected_version: {type: integer, minimum: 0, maximum: 2147483646}
                title: {type: string, maxLength: 100}
                body: {type: string, maxLength: 8000}
                content: {$ref: '#/components/schemas/RichDocument'}
                audience: {type: string, enum: [private, friends, community]}
                invitation: {type: string, enum: ['', your_version, teach_me, what_next]}
                allow_featuring: {type: boolean, description: 'Community chapters only. Lets a well-loved chapter appear on the Featured Stories wall; off by default'}
                topic: {type: string, maxLength: 32, description: 'Optional topic slug from GET /v1/blog/topics; empty clears it'}
      responses:
        '200': {description: Saved authoritative post and version}
        '400': {description: Invalid draft, exhausted quota or incomplete community profile}
        '401': {description: Authentication required}
        '403': {description: Not the author or feature disabled}
        '404': {description: Post absent or inaccessible}
        '409': {description: Stale version; fetch saved representation before retrying}
        '503': {description: Save confirmation unavailable; retain local text and read back}
    delete:
      tags: [blog]
      summary: Withdraw and delete an owned chapter
      description: Atomically hides the post and photos. Media cleanup retries physical deletion and respects legal holds. Text is scrubbed by cleanup; a minimal UUID tombstone prevents resurrection. Author deletion remains available while the feature is paused.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                expected_version: {type: integer, minimum: 1, maximum: 2147483646}
      responses:
        '200': {description: deleted true}
        '401': {description: Authentication required}
        '409': {description: Version changed or post no longer available}
  /v1/blog/posts/{postID}/photos/{photoID}:
    parameters:
      - {in: path, name: postID, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: photoID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [blog]
      summary: Stream an approved photo after current post audience authorization
      description: Private no-store bytes, no public media URL. Neither possession of UUID nor a friendship overrides blocks or private audience.
      responses:
        '200':
          description: Approved JPEG or PNG bytes
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        '401': {description: Authentication required}
        '404': {description: Photo or post not accessible}
    put:
      tags: [blog]
      summary: Add one approved photo to an owned private draft
      description: Stable photo UUID and normalized digest provide retry protection. Author must first save the post as private. JPEG or PNG only, 300 through 4096 pixels each dimension, maximum 10 MB, six photos per chapter and 100 MB stored per member. Decode and re-encode strips metadata; approval is required before insertion. No shared HTTP multipart replay caching.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, alt_text, expected_version]
              properties:
                image: {type: string, format: binary}
                alt_text: {type: string, minLength: 1, maxLength: 160}
                expected_version: {type: integer, minimum: 1, maximum: 2147483646}
      responses:
        '200': {description: Updated post with photo ID and new version}
        '400': {description: Invalid image or quota exceeded}
        '404': {description: Post not owned or unavailable}
        '409': {description: Stale version, UUID reused or post still published}
        '422': {description: Photo not approved; no attachment created}
        '503': {description: Moderation or storage unavailable; reload before retrying}
    delete:
      tags: [blog]
      summary: Remove a photo from an owned private draft
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                expected_version: {type: integer, minimum: 1, maximum: 2147483646}
      responses:
        '200': {description: Updated post and version}
        '404': {description: Photo not owned or unavailable}
        '409': {description: Stale version or post still published}
