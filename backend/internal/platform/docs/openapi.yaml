                allow: {type: boolean}
      responses:
        '200': {description: Updated entry}
        '400': {description: Invalid body}
        '401': {description: Authentication required}
        '403': {description: Own photo, not the author, not eligible, or feature disabled}
        '404': {description: Photo or comment not visible to the member}
