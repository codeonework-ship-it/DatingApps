          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Appeal list payload for user
          content:
            application/json:
              schema:
                type: object
                properties:
                  appeals:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModerationAppeal'
    post:
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
      summary: Submit moderation appeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, report_id, reason]
              properties:
                user_id:
                  type: string
                report_id:
                  type: string
                reason:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Appeal accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  appeal:
                    $ref: '#/components/schemas/ModerationAppeal'
  /v1/moderation/appeals/{appealID}:
    get:
      summary: Get moderation appeal status
      parameters:
        - in: path
          name: appealID
          required: true
          schema:
            type: string
        - in: query
          name: user_id
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Appeal status payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                  appeal:
                    $ref: '#/components/schemas/ModerationAppeal'
  /v1/admin/moderation/appeals:
    get:
      summary: List moderation appeals for admin review
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Appeal list payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  appeals:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModerationAppeal'
  /v1/admin/moderation/appeals/{appealID}/action:
    post:
      summary: Review or resolve moderation appeal
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: appealID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [submitted, under_review, resolved_upheld, resolved_reversed]
                resolution_reason:
                  type: string
      responses:
        '200':
          description: Appeal action accepted
  /v1/admin/moderation/rooms:
    get:
      tags: [rooms]
      summary: Operators list rooms with counts and recent room moderation
      description: Admin, moderator and trust_safety roles.
      responses:
        '200': {description: "{rooms: [room], recent_actions: [moderation_action]}"}
        '403': {description: Not an operator}
  /v1/admin/moderation/rooms/{roomID}/actions:
    parameters:
      - {in: path, name: roomID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [rooms]
      summary: Operator warns, mutes, unmutes, removes (any member, including hosts) or closes a room
      description: Same actions and mute durations as /v1/rooms/{roomID}/moderate; the log marks operator actions (metadata.operator).
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                target_user_id: {type: string, format: uuid}
                action: {type: string, enum: [warn_user, mute_user, unmute_user, remove_user, close_room]}
                reason: {type: string, maxLength: 280}
                duration: {type: string, enum: ['10m', '1h', session], description: mute_user only}
                duration_minutes: {type: integer, minimum: 1, maximum: 1440, description: mute_user only}
      responses:
        '200': {description: "{room, moderation_action}"}
        '400': {description: Unknown action or duration, or missing target}
        '403': {description: Not an operator}
        '404': {description: No such room}
        '409': {description: error_code ROOM_NOT_JOINED or ROOM_NOT_ACTIVE}
  /v1/admin/moderation/rooms/{roomID}/members:
    parameters:
      - {in: path, name: roomID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [rooms]
      summary: Operators list a room's members, including muted and removed people
      description: >-
        Admin, moderator and trust_safety roles. Current members first (hosts,
        then moderators, then most recently seen), then anyone no longer in the
        room whose mute or removal is still running. Blocks between members do
        not hide anyone from operators. muted_until is set while a mute runs;
        removed_until while a removal blocks rejoining.
      responses:
        '200': {description: "{members: [{user_id, name, photo_url, role, status, joined_at, last_seen_at, here_now, in_room, muted_until?, removed_until?}], count}"}
        '403': {description: Not an operator}
        '404': {description: No such room}
  /v1/admin/moderation/rooms/{roomID}/roles:
    parameters:
      - {in: path, name: roomID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [rooms]
      summary: Operator appoints or steps down a room moderator
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_id, role]
              properties:
                member_id: {type: string, format: uuid}
                role: {type: string, enum: [moderator, participant]}
      responses:
        '200': {description: "{member_id, role}"}
        '400': {description: Invalid role}
        '403': {description: Not an operator}
        '404': {description: No such room}
        '409': {description: error_code ROOM_NOT_JOINED (never joined, removed, or a host)}
