    BusinessReport:
      type: object
      description: >-
        Business report envelope. Money fields come in pairs: `<name>_minor`
        (integer minor units) and `<name>` (decimal string in the row's
        currency). Rows always carry `currency`; currencies are never summed.
        Member counts from 1 to 4 are the string "<5" and per-member averages
        over fewer than 5 members are null. See
        documents/BUSINESS_REPORTS_2026-10-01.md.
      properties:
        report: {type: string}
        window:
          type: object
          properties:
            since: {type: string, format: date-time}
            until: {type: string, format: date-time}
            timezone: {type: string}
            bucket: {type: string}
            note: {type: string}
        mode: {type: string, enum: [live, sandbox, all]}
        suppression:
          type: object
          properties:
            threshold: {type: integer}
            rule: {type: string}
        data_status:
          type: object
          description: Billing flag, provider and payment mode, live/sandbox/local payment counts in the window, `empty`, and the release-1 note (billing excluded, PEN-25).
          properties:
            billing_flag_enabled: {type: boolean}
            payments_provider: {type: string}
            payment_mode: {type: string}
            stripe_test_keys: {type: boolean}
            release_1_billing_excluded: {type: boolean}
            release_note: {type: string}
            live_payments_in_window: {type: integer}
            sandbox_payments_in_window: {type: integer}
            local_payments_in_window: {type: integer}
            selected_payments: {type: integer}
            empty: {type: boolean}
            sandbox_hint: {type: string}
        tables:
          type: array
          items: {type: string}
        definitions:
          type: object
          description: Short metric definitions keyed by metric name (string values).
    MarketingSpendInput:
      type: object
      required: [month, channel, currency]
      properties:
        month: {type: string, example: '2026-09', description: YYYY-MM}
        channel: {type: string, enum: [paid_social, search, influencer, events, referral_rewards, partnerships, pr, content, app_store, other]}
        market: {type: string, default: all, description: "'all' or a launch market city_key"}
        currency: {type: string, example: INR, description: ISO 4217}
        amount_minor: {type: integer, minimum: 0, description: Spend in minor units; wins over amount}
