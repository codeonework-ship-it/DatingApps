        '404':
          description: Match not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [graduation]
      summary: Propose leaving Connect together
      description: >-
        Opens a graduation proposal on an active, unlocked match with an
        optional note (200 characters) and whether the proposer's accepted
        friends should be told once the other member confirms. The other
        member receives a decision request in the same transaction. One open
        proposal per match. Locked conversations return 423
        CHAT_LOCKED_REQUIREMENT_PENDING.
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: matchID
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string, maxLength: 200}
                share_with_friends: {type: boolean, default: false}
      responses:
        '201':
          description: Graduation proposed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a member of this match or feature disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Match not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
