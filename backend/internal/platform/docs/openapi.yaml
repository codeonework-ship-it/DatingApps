  /v1/admin/analytics/snapshots/rebuild:
    post:
      tags: [analytics]
      summary: Rebuild the analytics snapshots for a range of completed UTC days (admin only, runs in the background)
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: {type: string, format: date}
                to: {type: string, format: date, description: At most yesterday (UTC); at most 400 days after from}
      responses:
        '202':
          description: Rebuild started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  run_id: {type: string, format: uuid}
                  status: {type: string}
                  from: {type: string, format: date}
                  to: {type: string, format: date}
                  note: {type: string}
        '400': {description: Invalid or incomplete range}
        '403': {description: Requires the admin role}
        '409': {description: Another snapshot run is in progress}
