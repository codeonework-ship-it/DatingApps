openapi: 3.1.0
info:
  title: Verified Dating Gateway API
  version: 1.0.0
  description: |
    Mobile-facing API exposed by API Gateway + Mobile BFF.
servers:
  - url: http://localhost:18080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      summary: Gateway health
      responses:
        '200':
          description: OK
  /metrics:
    get:
      security: []
      summary: Prometheus metrics
      responses:
        '200':
          description: Metrics payload
  /v1/auth/login:
    post:
      security: []
      summary: Sign in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  pattern: '^[a-z0-9]([a-z0-9._]{1,28}[a-z0-9])?$'
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Credential verification result and session tokens
        '400':
          description: Invalid request
  /v1/auth/signup:
    post:
      security: []
      summary: Create an account with a unique username and password
      description: >-
        account_kind defaults to dating. For introducer, name and date_of_birth
        are required (age 18–80); credentials and a private account are created
        atomically without gender, photos, profile draft or discovery publication.
        Accept terms before using introductions. Signup, login and refresh return
        account_kind; clients must route introducers to the separate workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  pattern: '^[a-z0-9]([a-z0-9._]{1,28}[a-z0-9])?$'
                account_kind: {type: string, enum: [dating, introducer], default: dating}
                name: {type: string, minLength: 2, maxLength: 80}
                date_of_birth: {type: string, format: date}
                password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Account creation, session tokens, and a display-once recovery code
  /v1/auth/refresh:
    post:
      security: []
      summary: Rotate a refresh token and issue a new session token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        '200': {description: Rotated session tokens}
        '401': {description: Invalid, expired, reused, or revoked refresh token}
  /v1/auth/logout:
    post:
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
      summary: Revoke the current bearer session
      responses:
        '200': {description: Current session revoked}
        '401': {description: Invalid bearer session}
  /v1/auth/sessions/revoke:
    post:
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
      summary: Revoke the current session or every session for the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                all_sessions: {type: boolean, default: false}
      responses:
        '200': {description: Requested sessions revoked}
  /v1/auth/password/change:
    post:
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
      summary: Change password and revoke all account sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string, format: password}
                new_password: {type: string, format: password, minLength: 8, maxLength: 128}
      responses:
        '200': {description: Password changed; reauthentication required}
        '400': {description: Password policy or current-password validation failed}
  /v1/auth/recovery-code/rotate:
    post:
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
      summary: Replace the account recovery code and return it once
      responses:
        '200': {description: Display-once recovery code}
  /v1/auth/password/recover:
    post:
      security: []
      summary: Recover an account with username and its display-once recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, recovery_code, new_password]
              properties:
                username: {type: string}
                recovery_code: {type: string}
                new_password: {type: string, format: password, minLength: 8, maxLength: 128}
      responses:
        '200': {description: Password reset and all existing sessions revoked}
        '400': {description: Invalid or expired recovery code}
  /v1/auth/recovery/assistance:
    post:
      security: []
      summary: Request operator-assisted account recovery
      description: |
        Records a recovery request without revealing whether the username
        exists. This endpoint never changes credentials or returns a recovery
        code; identity verification and resolution happen in the restricted
        trust-and-safety queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: {type: string, maxLength: 64}
                message: {type: string, maxLength: 500}
      responses:
        '202': {description: Generic acknowledgement for every valid username shape}
        '400': {description: Username is missing or malformed}
        '503': {description: Durable recovery persistence is unavailable}
  /v1/auth/signup/bootstrap:
    post:
      security:
        - bearerAuth: []
      summary: Bootstrap a durable app user after credential signup
      description: |
        Creates or idempotently updates the app-domain user row after username
        credential creation. Storage tables: `user_management.users` and
        `user_management.profile_drafts`. Existing non-empty user/draft fields
        are preserved, so returning users who already completed profile basics
        are not overwritten by a repeated signup attempt. Retry behavior is
        idempotent by `user_id`; clients may also send `Idempotency-Key`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, username, name, date_of_birth, gender]
              properties:
                user_id:
                  type: string
                  description: User id returned by `/v1/auth/signup`.
                username:
                  type: string
                  pattern: '^[a-z0-9]([a-z0-9._]{1,28}[a-z0-9])?$'
                name:
                  type: string
                  minLength: 2
                date_of_birth:
                  type: string
                  format: date
                  description: User must be 18–80 years old.
                gender:
                  type: string
                  enum: [M, F, Other]
      responses:
        '200':
          description: App user and draft are ready for terms/profile setup.
        '400':
          description: Invalid signup payload.
        '502':
          description: Durable persistence failed.
  /v1/account/{userID}/lifecycle:
    get:
      summary: Read the account's deactivation, deletion and export state
      description: >-
        Self-service only. The authenticated principal must match the path id;
        an operator cannot drive these endpoints on a member's behalf.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Current account lifecycle state}
        '403': {description: Path id does not match the authenticated principal}
        '503': {description: Account lifecycle persistence is unavailable}
  /v1/account/{userID}/deactivate:
    post:
      summary: Deactivate the account reversibly
      description: >-
        Clears is_active so the member leaves discovery, revokes live sessions,
        and retains all data. Reversible through /reactivate.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string}
      responses:
        '200': {description: Account deactivated}
        '403': {description: Path id does not match the authenticated principal}
        '409': {description: Account cannot be deactivated in its current state}
  /v1/account/{userID}/reactivate:
    post:
      summary: Restore a deactivated account
      description: >-
        Refused while the account is banned or has a pending deletion; an
        enforcement action cannot be undone by its subject.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Account reactivated}
        '403': {description: Path id does not match the authenticated principal}
        '409': {description: Banned, or a pending deletion must be cancelled first}
  /v1/account/{userID}/deletion:
    post:
      summary: Schedule account deletion after a grace period
      description: >-
        Deactivates immediately and schedules erasure. The request stays
        cancellable until effective_at so a misclick or a coerced request is
        recoverable.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string}
      responses:
        '202': {description: Deletion scheduled; grace period returned}
        '403': {description: Path id does not match the authenticated principal}
        '409': {description: A deletion is already scheduled}
    delete:
      summary: Cancel a scheduled account deletion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Deletion cancelled and the account reactivated}
        '403': {description: Path id does not match the authenticated principal}
        '409': {description: No deletion scheduled, or the grace period elapsed}
  /v1/account/{userID}/export:
    post:
      summary: Generate a copy of the member's own data
      description: >-
        Excludes credential and token material, and other members' profile
        data; counterparties appear as opaque ids. Message bodies the member
        wrote are included, those written to them are not.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '201': {description: Export generated and retained for a limited window}
        '403': {description: Path id does not match the authenticated principal}
    get:
      summary: Fetch the most recent unexpired export
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Export payload}
        '403': {description: Path id does not match the authenticated principal}
        '404': {description: No export available; request one first}
  /v1/account/{userID}/discovery/pause:
    get:
      tags: [graduation]
      summary: Read the member's discovery pause state
      description: >-
        Self-service only. Returns whether the member is currently hidden from
        discovery and the pause (reason graduated or manual, paused_at,
        resumed_at once resumed).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Current discovery pause state}
        '403': {description: Path id does not match the authenticated principal or feature disabled}
        '503': {description: Discovery pause persistence is unavailable}
    post:
      tags: [graduation]
      summary: Pause discovery manually
      description: >-
        Hides the member from every other member's deck and empties their own
        deck until they resume. Reason is always manual here; the graduated
        reason is written by a confirmed graduation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, enum: [manual]}
      responses:
        '200': {description: Discovery paused}
        '400': {description: Invalid reason}
        '403': {description: Path id does not match the authenticated principal or feature disabled}
  /v1/account/{userID}/discovery/resume:
    post:
      tags: [graduation]
      summary: Resume discovery
      description: >-
        Clears the member's discovery pause (graduated or manual) so they are
        dealt again and their own deck fills.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Discovery resumed}
        '403': {description: Path id does not match the authenticated principal or feature disabled}
        '404': {description: Discovery is not paused}
  /v1/auth/signup/workflow/{userID}:
    get:
      summary: Get the durable signup workflow resume state
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current workflow state, activity, and completion gate.
        '401':
          description: Session token does not belong to the requested user.
  /v1/discovery/{userID}:
    get:
      summary: Get discovery candidates
      parameters:
        - in: path
          name: userID
          required: true
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: mode
          required: false
          schema:
            type: string
            enum: [all, spotlight]
      responses:
        '200':
          description: Candidate list with optional spotlight metadata (`is_spotlight`, `spotlight_tier`, `spotlight_score`, `spotlight_reason`) and response summary (`spotlight_summary`, `spotlight_profiles`). Every candidate carries `reasons` (possibly empty) drawn from the curated daily set's catalogue.
  /v1/discovery/{userID}/today:
    get:
      tags: [discovery]
      summary: Today's curated set for the member
      description: >-
        Up to five candidates chosen once per UTC day from the caller's
        ordinary eligible deck (after every block, publication, preference and
        trust filter) and persisted so reloads return the same set. Ranking is
        a weighted sum of 24-hour reply rate, active trust badges, recency of
        activity and tags shared with the caller, with a fair-exposure
        adjustment: members already past the daily like cap are down-weighted
        and members with almost no impressions today are boosted. Candidates
        the caller has since swiped, blocked or matched are dropped from the
        response. Serving the set counts an impression for each candidate.
        Paid spotlight is not consulted. Only the member may read their own
        set; gated by the `curated_daily_set_enabled` runtime flag.
      parameters:
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The curated set for today
          content:
            application/json:
              schema:
                type: object
                required: [set_date, candidates, refreshed_at, model_version]
                properties:
                  set_date: {type: string, format: date}
                  refreshed_at:
                    type: string
                    format: date-time
                    description: When today's set was generated.
                  model_version: {type: string}
                  generated:
                    type: boolean
                    description: True when this request generated the set.
                  candidates:
                    type: array
                    maxItems: 5
                    items:
                      type: object
                      description: >-
                        Same shape as a `/v1/discovery/{userID}` candidate,
                        plus the explainability fields.
                      required: [id, reasons, why]
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
                        age: {type: integer}
                        bio: {type: string}
                        profession: {type: string}
                        education: {type: string}
                        isVerified: {type: boolean}
                        photoUrls:
                          type: array
                          items: {type: string}
                        reasons:
                          type: array
                          maxItems: 3
                          items:
                            type: string
                            enum:
                              - Both reply within a day
                              - Replies within a day
                              - Verified & active
                              - Shows up
                              - Respectful communicator
                              - Shares your intent
                              - Speaks your language
                              - Active this week
                              - Consistent profile
                              - Completes prompts
                        why: {type: string}
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not the member's own set or feature disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Discovery or curated-set persistence unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/discovery/{userID}/liked-me:
    get:
      tags: [discovery]
      summary: Members who liked the caller and are waiting on an answer
      description: >-
        Members who liked the caller whom the caller has neither liked nor
        passed back, newest like first. Answering with `POST /v1/swipe`
        removes the member from the list; a like back creates the match.
        Likers are filtered by the same publication, enforcement and two-way
        block rule as the public profile, so hidden members are neither
        listed nor counted. Free on every plan. Only the member may read
        their own list.
      parameters:
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
        - in: query
          name: limit
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Pending likes
          content:
            application/json:
              schema:
                type: object
                required: [profiles, count]
                properties:
                  count:
                    type: integer
                    description: >-
                      Visible pending likers (may exceed the number of
                      profiles returned when `limit` is lower).
                  profiles:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      description: >-
                        Public profile projection (same shape as
                        `/v1/profile/{userID}`) plus when the like was sent.
                      required: [id, name, photoUrls, isVerified, liked_at]
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
                        age: {type: integer}
                        bio: {type: string}
                        profession: {type: string}
                        education: {type: string}
                        isVerified: {type: boolean}
                        photoUrls:
                          type: array
                          items: {type: string}
                        liked_at: {type: string, format: date-time}
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not the member's own list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Likes persistence unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/swipe:
    post:
      summary: Swipe target profile
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: >-
            Client-generated key making the write repeat-safe. A retry with the
            same key, actor and route replays the original response and sets
            `X-Idempotent-Replay: true` instead of performing the work twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, target_user_id, is_like]
              properties:
                user_id:
                  type: string
                target_user_id:
                  type: string
                is_like:
                  type: boolean
      responses:
        '200':
          description: Swipe accepted
  /v1/matches/{userID}:
    get:
      summary: List matches
      parameters:
        - in: path
          name: userID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Match list
  /v1/matches/{matchID}:
    delete:
      summary: Unmatch
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: matchID
          required: true
          schema:
            type: string
        - in: query
          name: user_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unmatch result
  /v1/matches/{matchID}/read:
    post:
      summary: Mark messages as read
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: matchID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
      responses:
        '200':
          description: Read status updated
  /v1/profile/{userID}:
    get:
      summary: Get the published member profile
      description: >-
        Requires a valid bearer session and native PostgreSQL profile persistence.
        Returns an explicit allowlist of published display attributes, never a
        private draft, contact details, login identity, precise location or
        enforcement metadata. Rich attributes come from the completion snapshot;
        verification and photos come from current durable state. Only active,
        complete, unrestricted profiles with at least two approved active photos
        are visible. Blocks in either direction, deactivation, erasure, effective
        suspension and disabled credentials hide the profile. Verification is
        reported separately and is not itself a universal visibility requirement.
        Own draft and summary routes remain self-owned.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published profile in profile, with found=true; ordered photoUrls contain only approved active photos.
        '400':
          description: Malformed profile UUID.
        '401':
          description: Valid bearer session required.
        '404':
          description: Profile unavailable; nonexistent, blocked and ineligible profiles are intentionally indistinguishable.
        '503':
          description: Profile persistence is unavailable; no private or mock fallback.
    put:
      summary: Update member-authored profile attributes
      description: >-
        General descriptive fields only. Identity, DOB, gender, completion,
        verification, account restrictions, credentials and media must use their
        dedicated workflows. Unknown or server-owned fields return 400.
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  type: object
      responses:
        '200':
          description: Upsert result
        '400':
          description: Invalid update or field outside the member-editable allowlist.
  /v1/profile/{userID}/summary:
    get:
      summary: Get profile summary and counters
      parameters:
        - in: path
          name: userID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Profile summary
  /v1/profile/{userID}/draft:
    get:
      summary: Get mutable profile draft
      parameters:
        - in: path
          name: userID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Profile draft payload
    patch:
      summary: Patch mutable profile draft
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated profile draft
  /v1/profile/{userID}/photos:
    post:
      summary: Validate, persist, and attach a profile photo
      parameters:
        - in: path
          name: userID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG, WebP, or HEIC; 300-4096 px per side; maximum 10 MB.
      responses:
        '200':
          description: Updated profile draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '409':
          description: Five-photo count or 50 MB user quota reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Photo exceeds 10 MB
        '415':
          description: Unsupported or invalid image content
        '422':
          description: Image dimensions are outside the accepted range or provider policy rejected the content
        '503':
