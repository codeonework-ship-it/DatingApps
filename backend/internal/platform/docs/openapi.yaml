  /v1/chat/{matchID}/gifts/send:
    post:
      summary: Send a rose gift in chat
      description: >
        Supports idempotent retries via `Idempotency-Key`. Repeat requests with
        the same key for the same actor and route replay the original response
        without charging wallet coins again. A successful gift is also a chat
        message, so the sender's plan message quota applies before the gift is
        charged or written.
      parameters:
        - in: path
          name: matchID
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Client-generated key to prevent duplicate debits on retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sender_user_id, receiver_user_id, gift_id]
              properties:
                sender_user_id:
                  type: string
                receiver_user_id:
                  type: string
                gift_id:
                  type: string
                message_text:
                  type: string
                  maxLength: 240
                  description: Optional one-tap note shown above the gift card in chat.
      responses:
        '200':
          description: Gift sent successfully
          headers:
            X-Idempotent-Replay:
              description: Present and `true` when response is served from idempotency replay cache.
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                type: object
                properties:
                  gift_send:
                    $ref: '#/components/schemas/RoseGiftSendView'
                  message:
                    $ref: '#/components/schemas/ChatMessageView'
                  wallet:
                    $ref: '#/components/schemas/WalletView'
        '402':
          description: Insufficient wallet coins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: insufficient wallet coins
                error_code: INSUFFICIENT_COINS
        '423':
          description: Chat is locked pending engagement requirement completion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatLockedErrorResponse'
        '429':
          description: Daily message quota, free-gift allowance, gift velocity, or exclusive-gift limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                messageQuota:
                  summary: Plan message quota reached
                  value:
                    success: false
                    error: you have used today's messages on the Free plan; upgrade for more or try again after the reset
                    error_code: DAILY_MESSAGE_LIMIT_REACHED
                    plan_id: free
                    plan_name: Free
                    limit: 20
                    used: 20
                    resets_at: '2026-09-28T00:00:00Z'
                giftLimit:
                  summary: Gift-specific daily limit reached
                  value:
                    success: false
                    error: daily limit reached for this exclusive gift
                    error_code: GIFT_DAILY_LIMIT_REACHED
