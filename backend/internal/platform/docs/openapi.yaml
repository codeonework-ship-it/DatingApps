                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Plan is not accepted or has not started (DATE_PLAN_NOT_OPEN, DATE_PLAN_DEBRIEF_TOO_EARLY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/matches/{matchID}/graduation:
    get:
      tags: [graduation]
      summary: Current graduation proposal or confirmed graduation for a match
      description: >-
        Returns the open proposal or the confirmed graduation (if any), recent
        history, whether the match has graduated, whether the caller may
        propose (no open proposal, active and unlocked match, not yet
        graduated) and the caller's own discovery pause state. Only a member
        of the match may read it.
      parameters:
        - in: path
          name: matchID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Graduation state for the match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
