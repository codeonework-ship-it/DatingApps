  /v1/engagement/group-categories:
    get:
      tags: [groups]
      summary: Lifestyle categories for community groups
      description: The catalogue (migration 118) with the number of community groups in each, in display order.
      responses:
        '200':
          description: "{categories: [{slug, title, emoji, description, sort_order, group_count}]}"
        '401': {description: Authentication required}
        '403': {description: Groups are paused (groups_enabled)}
  /v1/engagement/group-friends:
    get:
      tags: [groups]
      summary: Friends for the group invite picker
      description: >-
        The signed-in member's accepted friends who are active and on neither
        side of a block. With group_id (a group the member can see), each
        friend's status is member, invited or available.
      parameters:
        - {in: query, name: group_id, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: "{friends: [{user_id, name, photo_url, status}]}"
        '401': {description: Authentication required}
        '404': {description: The group is unavailable}
  /v1/engagement/group-invites:
    get:
      tags: [groups]
      summary: The signed-in member's pending group invitations
      description: Invitations from members either side has blocked are hidden. Each carries the group summary and the inviter's name and photo.
      responses:
        '200':
          description: "{invites: [{id, group_id, status, inviter_user_id, inviter_name, inviter_photo_url, invited_at, group}], count, status}"
        '401': {description: Authentication required}
  /v1/engagement/groups:
    get:
      tags: [groups]
      summary: List the member's groups, or discover community groups
      description: >-
        scope=mine (default; joined_only=true is accepted for older clients)
        lists active memberships, most recently active first, with unread chat
        counts. scope=discover lists community groups the member is not in,
        optionally filtered by lifestyle category and a name search, most
        members first. Groups owned by someone either side has blocked are
        never listed.
      parameters:
        - {in: query, name: scope, required: false, schema: {type: string, enum: [mine, discover]}}
        - {in: query, name: category, required: false, schema: {type: string}}
        - {in: query, name: q, required: false, schema: {type: string}}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 50}}
      responses:
        '200':
          description: "{groups: [Group], count, scope, category}"
        '400': {description: Unknown scope}
        '401': {description: Authentication required}
        '403': {description: Groups are paused (groups_enabled)}
    post:
      tags: [groups]
      summary: Create a community group or a private friends group
      description: >-
        The owner is the signed-in member. Community groups are public, need a
        lifestyle category and anyone can join; private groups are invitation
        only. invitee_user_ids must all be accepted friends of the owner whom
        neither side has blocked (up to 50), otherwise nothing is created
        (403). Each invitee is notified. A repeated group_id from the same
        owner returns the existing group.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                group_id: {type: string, format: uuid, description: Optional client-generated id that makes retries safe}
                kind: {type: string, enum: [community, private]}
                category_slug: {type: string, description: Required for community groups}
                name: {type: string, minLength: 3, maxLength: 60}
                description: {type: string, maxLength: 500}
                city: {type: string, maxLength: 60}
                cover_emoji: {type: string}
                cover_color: {type: string, enum: [primary, secondary, tertiary]}
                invitee_user_ids:
                  type: array
                  maxItems: 50
                  items: {type: string, format: uuid}
      responses:
        '201':
          description: "{group: Group, invited_user_ids}"
        '400': {description: Invalid input}
        '401': {description: Authentication required}
        '403': {description: An invitee is not an accepted, unblocked friend; or the account cannot act}
        '409': {description: Group limit reached, or the id belongs to another member's group}
        '429': {description: Too many invitations today}
  /v1/engagement/groups/{groupID}:
    parameters:
      - {in: path, name: groupID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [groups]
      summary: A group, with its chat channel and member preview for members
      description: >-
        Members, invitees and (for community groups) anyone the owner has not
        blocked may read it. Only members receive channel_id, owner_user_id
        and members_preview; non-members of a community group see the member
        count only. A group removed after a review (reported with
        POST /v1/blog/reports/group/{groupID}) is visible to its members only,
        with moderation_state=removed, removed=true, no channel_id and no
        join, invite or edit actions, until an operator restores it.
        cover_photo_url, cover_photo_id and (owner only) cover_photo_status
        describe the cover photo; see /v1/engagement/groups/{groupID}/cover.
      responses:
        '200':
          description: "{group: Group}"
        '401': {description: Authentication required}
        '404': {description: Unavailable or not shared with the member}
    patch:
      tags: [groups]
      summary: Edit a group (owner only)
      description: Name, description, city, cover and, for community groups, category. A group never switches between community and private.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 3, maxLength: 60}
                description: {type: string, maxLength: 500}
                city: {type: string, maxLength: 60}
                category_slug: {type: string}
                cover_emoji: {type: string}
                cover_color: {type: string, enum: [primary, secondary, tertiary, '']}
      responses:
        '200':
          description: "{group: Group}"
        '400': {description: Invalid input}
        '401': {description: Authentication required}
        '403': {description: Not the owner, or the group was removed after a review}
        '404': {description: Not a member}
    delete:
      tags: [groups]
      summary: Delete a group for everyone (owner only)
      description: Removes the group, its invitations, memberships and chat.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200': {description: "{deleted: true, group_id}"}
        '401': {description: Authentication required}
        '403': {description: Not the owner}
        '404': {description: Not a member}
  /v1/engagement/groups/{groupID}/join:
    parameters:
      - {in: path, name: groupID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [groups]
      summary: Join a community group (idempotent)
      description: Private groups are joined by accepting an invitation. Members a moderator removed cannot rejoin by themselves.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200': {description: "{group: Group}"}
        '401': {description: Authentication required}
        '403': {description: Private group, removed by a moderator, or the group was removed after a review}
        '404': {description: Unavailable}
        '409': {description: The group is full, or the member is in 50 groups}
  /v1/engagement/groups/{groupID}/leave:
    parameters:
      - {in: path, name: groupID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [groups]
      summary: Leave a group (idempotent)
      description: >-
        When the owner leaves, ownership passes to the longest-standing
        moderator, else the longest-standing member (new_owner_user_id). An
        owner with nobody else deletes the group (deleted true). Leaving
        revokes the group chat at once.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200': {description: "{left: true, deleted, group_id, new_owner_user_id?}"}
        '401': {description: Authentication required}
        '404': {description: Unavailable}
  /v1/engagement/groups/{groupID}/members:
    parameters:
      - {in: path, name: groupID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [groups]
      summary: Members with names, photos and roles (members only)
      description: Owner first, then moderators, then members by join date. Members either side has blocked are hidden. is_friend says whether the viewer is already friends with each member.
      responses:
        '200': {description: "{members: [{user_id, name, photo_url, role, joined_at, is_me, is_friend}], count}"}
        '401': {description: Authentication required}
        '403': {description: Not a member of this community group}
        '404': {description: Unavailable}
  /v1/engagement/groups/{groupID}/members/{userID}:
    parameters:
      - {in: path, name: groupID, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: userID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [groups]
      summary: Promote, demote or remove a member
      description: The owner makes moderators and members and removes anyone; moderators remove plain members.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [make_moderator, make_member, remove]}
      responses:
        '200': {description: "{members}"}
        '400': {description: Invalid action, or acting on yourself}
        '401': {description: Authentication required}
        '403': {description: Role too low}
        '404': {description: Not a member}
  /v1/engagement/groups/{groupID}/cover:
    parameters:
      - {in: path, name: groupID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [groups]
      summary: Stream the group's cover photo to a viewer who may see it
      description: >-
        The viewer must be able to see the group (members and invitees;
        anyone the owner has not blocked for community groups; 404 otherwise).
        Approved covers are served to them; a pending cover only to the owner;
        none while the group is removed after a review, and none uploaded by
        someone either side has blocked. Group JSON carries cover_photo_url
        (this path with ?v=<cover_photo_id>, which changes with the photo) and
        cover_photo_id only when the viewer may see the cover, and, for the
        owner only, cover_photo_status (pending, approved or rejected).
        cover_emoji and cover_color remain the fallback.
      parameters:
        - in: header
          name: If-None-Match
          schema: {type: string}
          description: The ETag of a cached copy; 304 when unchanged
        - in: query
          name: v
          schema: {type: string}
          description: Cache-busting cover id from cover_photo_url (ignored by the server)
      responses:
        '200':
          description: >-
            Re-encoded image bytes with ETag (content SHA-256), nosniff and
            Cache-Control "private, max-age=300" (pending covers: private,
            no-store)
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        '304': {description: Not modified (If-None-Match matched the ETag)}
        '401': {description: Authentication required}
        '404': {description: Group unavailable, or no cover the viewer may see}
    put:
      tags: [groups]
      summary: Upload or replace the cover photo (owner only)
      description: >-
        Multipart upload of a JPEG or PNG (at most 10 MB, 300 to 4096 pixels a
        side). The bytes are validated, decoded and re-encoded so EXIF and
        other metadata never reach storage, then pass the shared media
        moderation. Approved covers show at once; covers the provider sends to
        human review are stored as pending (owner-only "Under review") until an
        operator decides (/v1/admin/moderation/group-covers); rejected photos
        are not stored and the current cover stays (422). The previous cover's
        object is deleted from storage. At most 10 uploads per group per day.
        Not cached in the shared replay ledger; send a client cover_id UUID so
        a retry returns the saved result.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: {type: string, format: binary}
                cover_id: {type: string, format: uuid, description: Client-generated id for retry safety}
      responses:
        '200': {description: "{group: Group, cover: {id, status: approved|pending}}"}
        '400': {description: Missing image, bad cover_id or malformed upload}
        '401': {description: Authentication required}
        '403': {description: Not the owner, or the group was removed after a review}
        '404': {description: Not a member, or the group is unavailable}
        '409': {description: cover_id already used for another group or member}
        '413': {description: Larger than 10 MB}
        '415': {description: Not a supported image}
        '422': {description: Image dimensions out of range, or the photo was not approved (nothing stored)}
        '429': {description: 10 cover uploads for this group today}
        '503': {description: Moderation or storage unavailable; retry with the same cover_id}
    delete:
      tags: [groups]
      summary: Remove the cover photo (owner only, idempotent)
      description: The group falls back to its emoji and colour; the object is deleted from storage. Also dismisses a "not approved" notice.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200': {description: "{group: Group, removed}"}
        '401': {description: Authentication required}
        '403': {description: Not the owner, or the group was removed after a review}
        '404': {description: Not a member, or the group is unavailable}
  /v1/engagement/groups/{groupID}/invites:
    parameters:
      - {in: path, name: groupID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [groups]
      summary: Invite friends to a group
      description: >-
        Community groups: any member invites. Private groups: the owner and
        moderators only. Every invitee must be an accepted friend of the
        inviter whom neither side has blocked (up to 50 a request, 200 a day).
        Existing members and pending invitations are skipped. Invitees are
        notified.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitee_user_ids]
              properties:
                invitee_user_ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: {type: string, format: uuid}
      responses:
        '200': {description: "{group_id, invited_user_ids}"}
        '400': {description: Invalid input}
        '401': {description: Authentication required}
        '403': {description: Not allowed to invite, or an invitee is not an accepted, unblocked friend}
        '404': {description: Not a member}
        '409': {description: The group is full}
        '429': {description: Too many invitations today}
  /v1/engagement/groups/{groupID}/invites/respond:
    parameters:
      - {in: path, name: groupID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [groups]
      summary: Accept or decline the signed-in member's invitation (idempotent)
      description: Accepting joins the group and notifies the inviter.
