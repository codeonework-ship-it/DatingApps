      responses:
        '200':
          description: Flagged accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        member_id: {type: string, format: uuid}
