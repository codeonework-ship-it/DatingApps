                reason: {type: string, enum: [harassment, inappropriate, fraud, fake]}
                description: {type: string, maxLength: 1000}
      responses:
        '200': {description: Authorized result, private no-store response}
        '400': {description: Invalid input or consent}
        '403': {description: Insufficient permissions}
        '404': {description: Source unavailable or access withdrawn}
        '409': {description: Stale version; refresh before retrying}
  /v1/themes:
    get:
      tags: [themes]
      summary: List active Photo Themes with visible entry counts and the member's own entry
      description: Also reports whether the member meets the community bar (complete profile and two approved photos) needed to share.
      responses:
        '200': {description: Authoritative result, private no-store response}
        '401': {description: Authentication required}
        '403': {description: Not eligible, lacking a club role, or feature disabled}
        '404': {description: Unavailable, removed or no longer shared with the member}
  /v1/themes/{themeID}/entries:
    parameters:
      - {in: path, name: themeID, required: true, schema: {type: string, format: uuid}}
      - {in: query, name: before, required: false, schema: {type: string, format: uuid}}
    get:
      tags: [themes]
      summary: Page a theme's gallery newest first, 20 per page
      description: Entries from blocked members, inactive accounts and members below the community bar are excluded. Removed entries are visible only to their author.
      responses:
        '200': {description: Authoritative result, private no-store response}
        '401': {description: Authentication required}
        '403': {description: Not eligible, lacking a club role, or feature disabled}
        '404': {description: Unavailable, removed or no longer shared with the member}
  /v1/themes/{themeID}/entries/{entryID}:
    parameters:
      - {in: path, name: themeID, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: entryID, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [themes]
      summary: Share one moderated photo for a theme using a client-generated entry UUID
      description: One live entry per member per theme. The image is decoded and re-encoded to strip metadata and must pass media moderation before it is stored. Retrying the same UUID with the same caption and description returns the saved entry. Not cached in the shared replay ledger; the entry UUID and content digest provide retry safety.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, caption, alt_text]
              properties:
                image: {type: string, format: binary}
                caption: {type: string, minLength: 1, maxLength: 280}
                alt_text: {type: string, minLength: 1, maxLength: 160}
                allow_featuring: {type: string, enum: ['true', 'false'], description: 'Lets a well-loved photo reach other members'' Today walls; off by default'}
      responses:
        '200': {description: Saved entry}
        '400': {description: Invalid image, caption or description}
        '401': {description: Authentication required}
        '403': {description: Member does not meet the community bar or feature disabled}
        '404': {description: Theme absent or closed}
        '409': {description: Member already shared for this theme or UUID reused}
        '422': {description: Photo not approved; nothing stored}
        '503': {description: Moderation or storage unavailable; reload before retrying}
    delete:
      tags: [themes]
      summary: Remove the member's own entry
      description: Hides the entry immediately; the media lifecycle worker releases the photo unless it is held as report evidence or under legal hold. Available while the feature is paused.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200': {description: Authoritative result, private no-store response}
        '401': {description: Authentication required}
        '403': {description: Not eligible, lacking a club role, or feature disabled}
        '404': {description: Unavailable, removed or no longer shared with the member}
  /v1/themes/{themeID}/entries/{entryID}/photo:
    parameters:
      - {in: path, name: themeID, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: entryID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [themes]
      summary: Stream an entry photo after visibility checks
      responses:
        '200':
          description: Approved JPEG or PNG bytes, private no-store
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        '401': {description: Authentication required}
        '404': {description: Entry unavailable to the member}
  /v1/themes/wall:
    get:
      tags: [themes]
      summary: Photos delivered to the member's wall (shown on Today), newest delivery first (up to 20)
      description: Photos reach walls in tiers, by default 50 likes and 5 approved comments for 50 walls and 100 likes and 10 comments for 100 (BLOG_WALL_TIERS, shared with chapters). Friends of the author are reached first, then members in the same city, then a stable pseudo-random order. A delivered photo shows only while the author allows featuring, it is active and has no open report, for 14 days after it first qualified.
      responses:
        '200': {description: Photo entries with engagement counts and theme titles}
        '401': {description: Authentication required}
  /v1/themes/{themeID}/entries/{entryID}/like:
    parameters:
      - {in: path, name: themeID, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: entryID, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [themes]
      summary: Like or react to a visible photo (idempotent)
      description: Members cannot like their own photo. 300 likes per member per day. Every reaction counts as one like for wall tiers, ranking and rewards. Reaching a new tier delivers the photo to more walls and notifies the author once.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: false
        description: Optional empathetic reaction. Omit it (or send no body) for a plain like, which keeps a reaction already chosen. Changing the reaction is still one like, earns no new reward and does not count toward the daily limit.
        content:
          application/json:
            schema:
              type: object
              properties:
                reaction: {type: string, enum: [love, hear_you, me_too, with_you, hug, proud], description: "love = Love this, hear_you = I hear you, me_too = Me too, with_you = I'm with you, hug = Sending a hug, proud = Proud of you"}
      responses:
        '200': {description: "Updated entry, including my_reaction (empty when not liked) and reactions (counts per reaction)"}
        '400': {description: Unknown reaction}
        '429': {description: Daily like limit reached}
        '401': {description: Authentication required}
        '403': {description: Own photo, not the author, not eligible, or feature disabled}
        '404': {description: Photo or comment not visible to the member}
    delete:
      tags: [themes]
      summary: Remove the member's like (idempotent)
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200': {description: Updated entry}
        '401': {description: Authentication required}
        '403': {description: Own photo, not the author, not eligible, or feature disabled}
        '404': {description: Photo or comment not visible to the member}
  /v1/themes/{themeID}/entries/{entryID}/featuring:
    parameters:
      - {in: path, name: themeID, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: entryID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [themes]
      summary: Turn wall reach on or off for the author's own photo
      description: Turning it off removes the photo from every wall immediately. Turning it on re-evaluates tiers using engagement already earned.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
