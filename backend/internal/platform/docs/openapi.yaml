  /v1/social/channels:
    get:
      tags: [social]
      summary: List my conversations that have messages
      description: Friend conversations, Conversation Room chats and group chats the member currently belongs to, newest first. Membership is read live from friendships, room participation and group membership. Gated by runtime flag social_chat_enabled.
      responses:
        '200': {description: "{channels: [{id, kind (friend|room|group), ref_id, title, peer_id, member_count, can_moderate, last_message_at, last_message, unread_count, read_only, read_only_until, read_only_message, muted, muted_until}]}. read_only: the member may read but not post (muted in a room) until read_only_until. muted: the member silenced this conversation's notifications, until muted_until (null while muted means until they turn them back on)."}
        '401': {description: Authentication required}
        '403': {description: Feature disabled}
  /v1/social/channels/{channelID}:
    parameters:
      - {in: path, name: channelID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [social]
      summary: Read one conversation the member belongs to
      responses:
        '200': {description: "{channel}"}
        '401': {description: Authentication required}
        '404': {description: Not a member, or the conversation does not exist}
  /v1/social/channels/{channelID}/messages:
    parameters:
      - {in: path, name: channelID, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [social]
      summary: Page through messages, oldest first within the page
      description: Messages from anyone the member blocked, or who blocked the member, are left out. Deleted and removed messages come back with deleted=true and an empty body. realtime_cursor is the newest chat websocket sequence for the member; open /v1/realtime/chat?after=<cursor> to receive social.message.created and social.message.deleted events (payload channel_id, message_id), and social.channel.updated when the member's own standing changes (payload channel_id, channel_kind, reason muted|unmuted, read_only_until).
      parameters:
        - {in: query, name: before, required: false, schema: {type: string, format: uuid}, description: Return messages older than this message}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: "{messages: [{id, channel_id, sender_id, sender_name, sender_photo_url, body, client_message_id, created_at, deleted, mine}], has_more, realtime_cursor}"}
        '401': {description: Authentication required}
        '404': {description: Not a member}
    post:
      tags: [social]
      summary: Send a message (idempotent by client_message_id)
      description: 1-2000 characters. At most 20 messages per member per minute. Resending the same client_message_id returns the original message. Members get a real-time event; friend and group conversations also notify at most once per conversation every ten minutes, skipping members who muted the conversation's notifications.
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body, client_message_id]
              properties:
                body: {type: string, maxLength: 2000}
                client_message_id: {type: string, format: uuid}
      responses:
        '201': {description: "{message}"}
        '400': {description: Empty, too long, or missing client_message_id}
        '401': {description: Authentication required}
        '403': {description: "error_code CHANNEL_READ_ONLY: the member is muted (e.g. \"You're muted in this room until 21:30 UTC.\"); read_only_until says when it ends"}
        '404': {description: Not a member}
        '429': {description: Sending too quickly}
  /v1/social/channels/{channelID}/messages/{messageID}:
    parameters:
      - {in: path, name: channelID, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: messageID, required: true, schema: {type: string, format: uuid}}
    delete:
      tags: [social]
      summary: Delete my message, or remove one as a host or moderator (idempotent)
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200': {description: "{deleted: true}"}
        '401': {description: Authentication required}
        '403': {description: Not the sender and not allowed to moderate this conversation}
        '404': {description: Not a member, or no such message}
  /v1/social/channels/{channelID}/read:
    parameters:
      - {in: path, name: channelID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [social]
      summary: Mark the conversation read up to now (idempotent)
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200': {description: "{read: true}"}
        '401': {description: Authentication required}
        '404': {description: Not a member}
  /v1/social/channels/{channelID}/mute:
    parameters:
      - {in: path, name: channelID, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [social]
      summary: Mute this conversation's notifications (idempotent)
      description: For the caller only. Real-time events still arrive; only notifications are skipped. Setting it again replaces the previous choice. Any conversation kind (rooms never notify, so the app offers it for friend and group chats).
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                duration: {type: string, enum: ['1h', '8h', '1w', forever], description: forever lasts until the member turns notifications back on}
                minutes: {type: integer, minimum: 1, maximum: 43200, description: Used when duration is absent}
      responses:
        '200': {description: "{channel, muted: true, muted_until (null for forever)}"}
        '400': {description: Missing or unknown duration}
        '401': {description: Authentication required}
        '404': {description: Not a member}
    delete:
      tags: [social]
      summary: Turn this conversation's notifications back on (idempotent)
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200': {description: "{channel, muted: false, muted_until: null}"}
        '401': {description: Authentication required}
        '404': {description: Not a member}
  /v1/social/friends/{friendID}/channel:
    parameters:
      - {in: path, name: friendID, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [social]
      summary: Open (or create) the conversation with an accepted friend (idempotent)
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      responses:
        '200': {description: "{channel}"}
        '400': {description: Yourself}
        '401': {description: Authentication required}
        '403': {description: Not an accepted friend, or either of you blocked the other}
  /v1/friends/{userID}:
    get:
      tags: [friends]
      summary: "Get friends"
      description: >-
        The caller's accepted friends and open requests both ways in `friends`.
        Each row has user_id, friend_user_id, status (accepted|pending),
        direction (''|incoming|outgoing), created_at, updated_at, friend_name
        and, from migration 116, friend_username, friend_photo_url, friend_city
        and source (search|match|profile|room|group). Members who are no longer
        active or where either side blocked the other are left out.
      parameters:
        - in: path
          name: userID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [friends]
      summary: "Send a friend request"
      description: >-
        Sends a request to friend_user_id and notifies them
        (friend_request.received, route /friends). Never downgrades: an
        accepted friendship stays accepted and a repeated request returns the
        open one. If they already asked the caller, this accepts their request
        (both become friends; they get friend_request.accepted). After a
        decline the same requester waits 7 days; at most 30 requests in any
        24 hours. Returns {friend} with the resulting status.
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [friend_user_id]
              properties:
                friend_user_id:
                  type: string
                source:
                  type: string
                  enum: [search, match, profile, room, group]
                  description: Where the request started (optional)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Invalid request (yourself, unknown source)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not the caller's path, or the caller's account cannot add friends
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Member unavailable (inactive, or either side blocked the other)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Decline cooldown (7 days) or daily request limit (30 per 24 hours)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/friends/{userID}/search:
    get:
      tags: [friends]
      summary: "Find members to add as friends"
      description: >-
        Username or name prefix search (q, at least 3 letters, a leading @ is
        ignored) over active adult dating members, excluding the caller,
        anyone either side blocked and anyone who turned off "Let people find
        me in friend search" (/v1/friends/{userID}/search-visibility). At most
        10 results, each with only
        user_id, name, username, city, photo_url and relationship
        (none|friends|outgoing|incoming).
      parameters:
        - in: path
          name: userID
          required: true
          schema:
            type: string
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 3
      responses:
        '200':
          description: "{results: [{user_id, name, username, city, photo_url, relationship}]}"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Query shorter than 3 letters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not the caller's path, or the caller's account is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/friends/{userID}/search-visibility:
    parameters:
      - in: path
        name: userID
        required: true
        schema:
          type: string
    get:
      tags: [friends]
      summary: "Read \"Let people find me in friend search\""
      description: >-
        The signed-in member's own setting (default true). When false the
        member is left out of everyone's friend search; people who already see
        them (matches, rooms, groups, profile) can still send a request.
      responses:
        '200':
          description: "{visible: bool}"
          content:
