  /v1/realtime/chat:
    get:
      summary: Open the resumable local chat event stream
      description: >
        Upgrades to WebSocket and replays durable PostgreSQL outbox events with
        sequence greater than `after`. Authenticate with the normal bearer
        access token. Clients reconnect using the last received sequence.
      parameters:
        - in: query
          name: after
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        '101':
          description: WebSocket protocol switched; chat event stream opened
        '400':
          description: Invalid resume cursor
        '401':
          description: Valid bearer session required
        '503':
          description: Realtime persistence unavailable
