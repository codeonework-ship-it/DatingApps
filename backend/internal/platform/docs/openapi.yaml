  /v1/matches/{matchID}/plans:
    get:
      tags: [date-plans]
      summary: Open date plan, history and share groups for a match
      description: >-
        Returns the open plan (proposed or accepted) if any, recent plan
        history, the friend groups the caller can share a plan with, and
        whether the caller may propose (no open plan and the conversation is
        unlocked). Only a member of the match may read it.
      parameters:
        - in: path
          name: matchID
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Plan state for the match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a member of this match or feature disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Match or plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Plan state conflict (SHARED_AVAILABILITY_CHANGED, DATE_PLAN_ALREADY_OPEN, DATE_PLAN_NOT_OPEN, DATE_PLAN_MATCH_INACTIVE, DATE_PLAN_CHECKIN_TOO_EARLY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [date-plans]
      summary: Propose a date plan
      description: >-
        Creates a plan with a time window (at most 12 hours, within 90 days),
        a venue category, an optional venue name, area and note, and the
        friend groups to share it with. The proposer's accepted friends and
        the chosen groups are notified in the same transaction; the other
        member of the match receives a decision request. One open plan per
        match. Locked conversations return 423 CHAT_LOCKED_REQUIREMENT_PENDING.
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: matchID
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [window_start, window_end, venue_category]
              properties:
                window_start: {type: string, format: date-time}
                window_end: {type: string, format: date-time}
                venue_category:
                  type: string
                  enum: [coffee, meal, drinks, walk, activity, event, video_call, other]
                venue_name: {type: string, maxLength: 120}
                venue_area: {type: string, maxLength: 120}
                note: {type: string, maxLength: 280}
                budget_preference: {type: string, enum: [flexible, free, modest, treat], default: flexible}
                atmosphere_preferences:
                  type: array
                  maxItems: 3
                  items: {type: string, enum: [quiet, relaxed, lively, outdoors, indoors]}
                  description: Optional settings to enjoy. Omitted on a counterproposal preserves the current choices; an empty array clears them.
                accessibility_preferences:
                  type: array
                  maxItems: 6
                  items: {type: string, enum: [step_free, accessible_toilet, seating, low_noise, nearby_transit, captions]}
                  description: Optional functional requests shared only in the participants' plan. Not verified venue facilities, never added to friend updates. Omitted on a counterproposal preserves the current choices.
                shared_window:
                  type: object
                  required: [start, end]
                  properties:
                    start: {type: string, format: date-time}
                    end: {type: string, format: date-time}
                  description: Optional source of a selected suggestion. The proposed start/end must fit this window and a current intersection of both opted-in schedules; otherwise 409 SHARED_AVAILABILITY_CHANGED. Manual proposals omit this field and do not claim shared availability.
                group_ids:
                  type: array
                  maxItems: 10
                  items: {type: string, format: uuid}
      responses:
        '201':
          description: Plan proposed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a member of this match or feature disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Match or plan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Plan state conflict (SHARED_AVAILABILITY_CHANGED, DATE_PLAN_ALREADY_OPEN, DATE_PLAN_NOT_OPEN, DATE_PLAN_MATCH_INACTIVE, DATE_PLAN_CHECKIN_TOO_EARLY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          description: Conversation is still locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/matches/{matchID}/plans/{planID}/decision:
    post:
      tags: [date-plans]
      summary: Accept or decline a proposed date plan
      description: >-
        Only the recipient of the current proposal may decide. Counterproposals require the current expected_version. Accepting notifies both members'
        friends and chosen groups; declining tells only the proposer.
