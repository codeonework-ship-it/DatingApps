  /v1/admin/safety/gift-sends/{sendID}/reverse:
    post:
      tags: [admin]
      summary: Refund and retract a gift send from the safety queue
      description: >-
        Safety-console alias for the billing gift reversal command. It performs
        the same atomic, once-only refund and message retraction and requires
        admin, ops_admin, or trust_safety role.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sendID
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 3, maxLength: 500}
      responses:
        '200': {description: Gift refunded and retracted}
        '400': {description: Invalid reversal reason, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Operator role required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Gift send not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Gift already reversed, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '503': {description: Gift ledger unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/admin/billing/revenue-analytics:
    get:
      tags: [admin]
      summary: "Admin - Revenue analytics (windowed, per currency)"
      description: >-
        Windowed (default last 30 days) and aggregated in SQL. Revenue per
        currency with reconciliation semantics (gross, refunded, chargeback,
        disputed, net = success + partially_refunded net of refunds); payments
        by status and currency; coin purchases (provider-backed buys only) vs
        non-revenue credits (admin top-ups, promotions, bootstrap and opening
        balances, gift refunds); subscriptions by current status. Sandbox is
        excluded unless mode=sandbox|all; local activations are never revenue.
        Member counts 1–4 are "<5". Requires an operator role (finance and
        analyst may read).
      parameters:
        - $ref: '#/components/parameters/BusinessSince'
        - $ref: '#/components/parameters/BusinessUntil'
        - $ref: '#/components/parameters/BusinessTZ'
        - $ref: '#/components/parameters/BusinessMode'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Operator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/admin/billing/stats:
    get:
      tags: [admin]
      summary: "Admin - Billing KPI summary (windowed, per currency)"
      description: >-
        Coins purchased (provider-backed buys only), net and gross revenue per
        currency, unique paying members ("<5" below five) and settled payment
        count for the window (default 30 days). total_revenue_minor is set
        only when the window holds a single currency and is null otherwise;
        currencies are never added together. Sandbox excluded unless
        mode=sandbox|all.
      parameters:
        - $ref: '#/components/parameters/BusinessSince'
        - $ref: '#/components/parameters/BusinessUntil'
        - $ref: '#/components/parameters/BusinessTZ'
