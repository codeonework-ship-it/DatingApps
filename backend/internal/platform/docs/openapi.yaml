  /v1/matches/{matchID}/plans/{planID}/debrief:
    post:
      tags: [date-plans]
      summary: Answer the post-date debrief
      description: >-
        Records the calling member's private answers once the plan window has
        started: whether the date happened, whether they would meet again,
        whether they felt safe, and a note. Answers may be revised until the
        plan resolves. When both members have answered the plan becomes
        completed (both friend lists are told the date happened),
        did_not_happen, or disputed; completed dates feed the "Shows up"
        trust badge. Individual answers stay private. mutual_second_yes becomes true only if both members confirm the date happened, both would meet again and both set share_mutual_interest. Reporting is independent.
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: matchID
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: planID
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [happened]
              properties:
                share_mutual_interest: {type: boolean, default: false}
                happened: {type: boolean}
                would_meet_again: {type: boolean}
                felt_safe: {type: boolean}
                note: {type: string, maxLength: 280}
      responses:
        '200':
          description: Debrief recorded; resolved_status is set when the plan resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
