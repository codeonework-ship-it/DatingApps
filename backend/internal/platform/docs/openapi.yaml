            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/matches/{matchID}/graduation/{graduationID}/decision:
    post:
      tags: [graduation]
      summary: Confirm or decline a graduation proposal
      description: >-
        Only the other member may decide. Confirming marks the match
        graduated (the chat stays open), hides both members from discovery,
        records a pending reward for each member and, for every member who
        chose share_with_friends, tells their accepted friends. Declining
        tells only the proposer.
