        - in: path
          name: userID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User settings payload
    patch:
      summary: Patch user settings
      description: >-
        Partial update. Every key is optional; omitted keys keep their stored
        value. `locale` is the member's UI language as a BCP 47 tag limited to
        `language[-REGION]` (`de`, `en-GB`); an empty string or `null` returns
        the member to the device language and any other shape is refused
        with 400.
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - in: path
          name: userID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                show_age:
                  type: boolean
                show_exact_distance:
                  type: boolean
                show_online_status:
                  type: boolean
                notify_new_match:
                  type: boolean
                notify_new_message:
                  type: boolean
                notify_likes:
                  type: boolean
                theme:
                  type: string
                  description: "`light` | `dark` | `auto`, optionally `mode:preset`."
                locale:
                  type: string
                  nullable: true
                  pattern: '^[a-z]{2}(-[A-Z]{2})?$'
                  description: >-
                    Member-chosen UI language (`en-US`, `en-GB`, `de`, `fr`,
                    `ru`, `es`, `it`, `pt`, `nl`, `pl`). Empty or null follows
                    the device language.
      responses:
        '200':
          description: User settings payload
