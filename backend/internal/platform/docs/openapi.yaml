  /v1/admin/billing/webhook-events:
    get:
      summary: List payment provider webhook events
      description: >-
        Operator view of the billing webhook ledger: every verified provider
        event with its processing status (`received`, `processed`, `ignored`,
        `failed`) and error. Readable by admin, ops_admin and analyst roles.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: {type: integer, default: 50, maximum: 500}
        - in: query
          name: offset
          schema: {type: integer, default: 0}
        - in: query
          name: status
          schema: {type: string, enum: [received, processed, ignored, failed]}
        - in: query
          name: event_type
          schema: {type: string}
      responses:
        '200':
          description: Webhook events page
          content:
            application/json:
              schema:
                type: object
                required: [events, total]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        provider: {type: string}
                        event_id: {type: string}
                        event_type: {type: string}
                        event_created_at: {type: string, format: date-time}
                        received_at: {type: string, format: date-time}
                        processed_at: {type: string, format: date-time}
                        status: {type: string}
                        error: {type: string}
                  total: {type: integer}
                  correlation_id: {type: string}
  /v1/admin/billing/reconciliation:
    get:
      summary: Settlement reconciliation report
      description: >-
        Compares provider-settled payments with what the product granted.
        Net revenue counts settled provider payments minus refunds and excludes
        chargebacks, local activations, administrative grants and promotions.
        Lists anomalies: coin payments without a wallet credit, wallet credits
        without a settled payment, reversed coin purchases, active
        subscriptions without a settled payment for the period, chargebacks on
        live subscriptions, failed webhooks and orphaned checkouts.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: since
          schema: {type: string, description: RFC3339 or YYYY-MM-DD; default 30 days ago}
        - in: query
          name: until
          schema: {type: string, description: RFC3339 or YYYY-MM-DD; default now}
      responses:
        '200':
          description: Reconciliation report
          content:
            application/json:
              schema:
                type: object
                properties:
                  window: {type: object}
                  currency: {type: string}
                  provider: {type: string}
                  revenue: {type: object}
                  payments_by_status: {type: array, items: {type: object}}
                  wallet: {type: object}
                  subscriptions: {type: object}
                  webhooks: {type: object}
                  checkouts: {type: object}
                  anomaly_count: {type: integer}
                  anomalies:
                    type: array
                    items:
                      type: object
                      properties:
                        type: {type: string}
                        id: {type: string}
                        detail: {type: string}
        '503':
          description: Billing persistence unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/admin/billing/gift-sends/{sendID}/reverse:
    post:
      tags: [admin]
      summary: Refund and retract a gift send
      description: >-
        Atomically marks a sent gift as refunded, returns its paid coins to the
        sender (or restores the free-gift allowance), retracts the linked chat
        message, and records the operator and reason. Requires admin,
        ops_admin, or trust_safety role. A gift can be reversed only once.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sendID
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 3, maxLength: 500}
      responses:
        '200':
          description: Gift refunded and retracted
          content:
            application/json:
              schema:
                type: object
                required: [gift_send_id, sender_user_id, coins_refunded, sender_balance, message_retracted, status]
                properties:
                  gift_send_id: {type: string, format: uuid}
                  sender_user_id: {type: string, format: uuid}
                  coins_refunded: {type: integer, minimum: 0}
                  sender_balance: {type: integer, minimum: 0}
                  message_retracted: {type: boolean}
                  status: {type: string, enum: [refunded]}
        '400': {description: Invalid reversal reason, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Operator role required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Gift send not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Gift already reversed, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '503': {description: Gift ledger unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/admin/billing/wallets/frozen:
    get:
      tags: [admin]
      summary: List wallets frozen after purchase reversal
      description: >-
        Lists wallets with unrecovered coin debt after a refund or chargeback.
        Requires an authenticated admin operator.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Frozen wallet queue
          content:
            application/json:
              schema:
                type: object
                required: [wallets, count]
                properties:
                  count: {type: integer, minimum: 0}
                  wallets:
                    type: array
                    items:
                      type: object
                      required: [user_id, coin_balance, debt_coins, frozen_at, frozen_reason]
                      properties:
                        user_id: {type: string, format: uuid}
                        coin_balance: {type: integer, minimum: 0}
                        debt_coins: {type: integer, minimum: 0}
                        frozen_at: {type: string, format: date-time}
                        frozen_reason: {type: string}
        '401': {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '503': {description: Billing persistence unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/admin/billing/wallets/{userID}/review:
    post:
      tags: [admin]
      summary: Resolve a frozen wallet
      description: >-
        Collects outstanding debt from the current wallet balance and unfreezes
        it, or records an operator-approved write-off for any remaining debt.
        Requires admin or ops_admin role and emits an append-only audit event.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userID
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, note]
              properties:
                action: {type: string, enum: [collect_and_unfreeze, write_off_and_unfreeze]}
                note: {type: string, minLength: 10, maxLength: 1000}
      responses:
        '200':
          description: Wallet reviewed and unfrozen
          content:
            application/json:
              schema:
                type: object
                required: [user_id, coin_balance, debt_collected, debt_written_off, frozen]
                properties:
                  user_id: {type: string, format: uuid}
                  coin_balance: {type: integer, minimum: 0}
                  debt_collected: {type: integer, minimum: 0}
                  debt_written_off: {type: integer, minimum: 0}
                  frozen: {type: boolean, enum: [false]}
        '400': {description: Invalid action or note, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Operator role required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Wallet not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Wallet is not frozen or debt remains, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '503': {description: Billing persistence unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/admin/billing/fraud/cases:
    get:
      tags: [admin]
      summary: List coin-economy fraud cases
      description: Returns the durable paid-gift and coin-checkout review queue, ordered by severity and recency.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: status, schema: {type: string, enum: [open, reviewing, cleared, confirmed, all], default: open}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200': {description: Fraud review queue, content: {application/json: {schema: {$ref: '#/components/schemas/EconomyFraudCaseList'}}}}
        '401': {description: Authenticated operator role required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/admin/billing/fraud/cases/{caseID}/resolve:
    post:
      tags: [admin]
      summary: Resolve a coin-economy fraud case
      description: Clears a false positive and its attributed wallet lock, or confirms the case. Requires admin, ops_admin, or trust_safety.
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: caseID, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [resolution, note], properties: {resolution: {type: string, enum: [cleared, confirmed]}, note: {type: string, minLength: 10, maxLength: 1000}}}}}
      responses:
        '200': {description: Case resolved}
        '400': {description: Invalid resolution, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Required operator role missing, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Fraud case not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Fraud case already resolved, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/admin/billing/fraud/rules:
    get:
      tags: [admin]
