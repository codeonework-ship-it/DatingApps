syntax = "proto3";

package auth.v1;

option go_package = "github.com/verified-dating/backend/gen/auth/v1;authv1";

message CredentialRequest {
  string username = 1;
  string password = 2;
}

message AuthResponse {
  bool success = 1;
  string access_token = 2;
  string refresh_token = 3;
  string user_id = 4;
  string error = 5;
}

service AuthService {
  rpc Login(CredentialRequest) returns (AuthResponse);
  rpc Signup(CredentialRequest) returns (AuthResponse);
}
