# Platform alerts for the single-VPS deployment: scrape targets, PostgreSQL
# (postgres_exporter), host and disks (node_exporter + the connect disk-usage
# textfile), public uptime/TLS/WebSocket (blackbox_exporter) and the
# monitoring stack itself. Job names match deploy/monitoring/prometheus/prometheus.yml.
# Runbooks: documents/MONITORING_RUNBOOKS_2026-10-01.md
groups:
  - name: verified-dating-platform
    interval: 30s
    rules:
      - alert: VerifiedDatingTargetDown
        expr: up{job=~"connect-.*"} == 0
        for: 2m
        labels:
          severity: page
          owner: platform-oncall
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.component }}) is not answering metrics scrapes"
          description: "Prometheus could not scrape {{ $labels.instance }} for two minutes. The process is down, hung or bound to a different port."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingtargetdown

      - alert: VerifiedDatingProcessRestarting
        expr: changes(process_start_time_seconds{job=~"connect-.*"}[30m]) > 3
        labels:
          severity: ticket
          owner: platform-oncall
        annotations:
          summary: "{{ $labels.component }} restarted more than three times in 30 minutes"
          description: "systemd keeps restarting {{ $labels.component }} ({{ $value | humanize }} restarts): crash loop or OOM kill."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingprocessrestarting

      - alert: VerifiedDatingSystemdUnitFailed
        expr: node_systemd_unit_state{name=~"connect.*|prometheus.*|alertmanager.*|postgresql.*|nginx.*",state="failed"} == 1
        for: 1m
        labels:
          severity: page
          owner: platform-oncall
        annotations:
          summary: "systemd unit {{ $labels.name }} is in failed state"
          description: "{{ $labels.name }} gave up restarting. Nothing will bring it back without an operator."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingsystemdunitfailed

  - name: verified-dating-database
    interval: 30s
    rules:
      - alert: VerifiedDatingPostgresDown
        expr: pg_up == 0 or absent(pg_up{job="connect-postgres"})
        for: 1m
        labels:
          severity: page
          owner: platform-oncall
        annotations:
          summary: PostgreSQL is unreachable
          description: "postgres_exporter cannot connect to PostgreSQL (or is not being scraped). Every API write and most reads fail."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingpostgresdown

      - alert: VerifiedDatingPostgresConnectionsNearLimit
        expr: |
          sum by (job, instance) (pg_stat_activity_count)
            / on (job, instance) max by (job, instance) (pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: page
          owner: platform-oncall
        annotations:
          summary: PostgreSQL is using more than 80% of max_connections
          description: "{{ $value | humanizePercentage }} of max_connections are open. New pools and the operator console will fail to connect at 100%."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingpostgresconnectionsnearlimit

      - alert: VerifiedDatingPostgresPoolWaiting
        expr: sum by (job, instance, pool) (rate(verified_dating_db_pool_wait_seconds_total[5m])) > 0.5
        for: 10m
        labels:
          severity: ticket
          owner: platform-oncall
        annotations:
          summary: "Requests wait for a connection from pool {{ $labels.pool }}"
          description: "Callers spent {{ $value | humanize }} seconds per second waiting for a free connection in {{ $labels.pool }}."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingpostgrespoolwaiting

      - alert: VerifiedDatingPostgresLongTransaction
        expr: max by (job, instance, datname, state) (pg_stat_activity_max_tx_duration{state=~"idle in transaction|active",datname!~"template.*|postgres"}) > 300
        for: 5m
        labels:
          severity: ticket
          owner: platform-oncall
        annotations:
          summary: "A PostgreSQL transaction in {{ $labels.datname }} has been {{ $labels.state }} for over five minutes"
          description: "Longest transaction: {{ $value | humanizeDuration }}. It holds locks and blocks vacuum."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingpostgreslongtransaction

  - name: verified-dating-host
    interval: 30s
    rules:
      - alert: VerifiedDatingMediaDiskLow
        expr: |
          verified_dating_disk_avail_bytes{path_role="media"} / verified_dating_disk_size_bytes{path_role="media"} < 0.15
        for: 10m
        labels:
          severity: ticket
          owner: platform-oncall
        annotations:
          summary: "Media storage ({{ $labels.path }}) has less than 15% free"
          description: "{{ $value | humanizePercentage }} free on the filesystem holding the media directory. Uploads fail when it fills."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingmediadisklow

      - alert: VerifiedDatingDatabaseDiskLow
        expr: |
          verified_dating_disk_avail_bytes{path_role="postgres"} / verified_dating_disk_size_bytes{path_role="postgres"} < 0.15
        for: 10m
        labels:
          severity: page
          owner: platform-oncall
        annotations:
          summary: "PostgreSQL data directory ({{ $labels.path }}) has less than 15% free"
          description: "{{ $value | humanizePercentage }} free. PostgreSQL stops accepting writes (and may crash) when the disk fills."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingdatabasedisklow

      - alert: VerifiedDatingFilesystemAlmostFull
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay|devtmpfs|efivarfs",mountpoint!~"/boot.*|/snap.*"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay|devtmpfs|efivarfs",mountpoint!~"/boot.*|/snap.*"} < 0.05
        for: 5m
        labels:
          severity: page
          owner: platform-oncall
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} has less than 5% free"
          description: "{{ $value | humanizePercentage }} free on {{ $labels.mountpoint }} ({{ $labels.device }})."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingfilesystemalmostfull

      - alert: VerifiedDatingFilesystemFillingUp
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay|devtmpfs|efivarfs",mountpoint!~"/boot.*|/snap.*"}[6h], 24 * 3600) < 0
          and node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay|devtmpfs|efivarfs",mountpoint!~"/boot.*|/snap.*"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|squashfs|overlay|devtmpfs|efivarfs",mountpoint!~"/boot.*|/snap.*"} < 0.3
        for: 30m
        labels:
          severity: ticket
          owner: platform-oncall
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} will fill within 24 hours at the current rate"
          description: "Linear prediction over the last six hours reaches zero free bytes within a day."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingfilesystemfillingup

      - alert: VerifiedDatingDiskUsageReportStale
        expr: time() - verified_dating_disk_usage_report_timestamp_seconds > 3 * 3600
        for: 10m
        labels:
          severity: ticket
          owner: platform-oncall
        annotations:
          summary: The media/database disk usage report has not been refreshed for three hours
          description: "connect-disk-usage.timer stopped writing the node_exporter textfile; the media and database disk alerts are blind."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingdiskusagereportstale

      - alert: VerifiedDatingHostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 10m
        labels:
          severity: ticket
          owner: platform-oncall
        annotations:
          summary: Host has less than 10% memory available
          description: "{{ $value | humanizePercentage }} of RAM available. The OOM killer will pick PostgreSQL or the BFF next."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatinghostmemorylow

      - alert: VerifiedDatingHostOOMKill
        expr: increase(node_vmstat_oom_kill[30m]) > 0
        labels:
          severity: ticket
          owner: platform-oncall
        annotations:
          summary: The kernel OOM killer terminated a process
          description: "{{ $value | humanize }} OOM kills in 30 minutes."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatinghostoomkill

      - alert: VerifiedDatingHostCPUSaturated
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 15m
        labels:
          severity: ticket
          owner: platform-oncall
        annotations:
          summary: Host CPU is above 90% for fifteen minutes
          description: "CPU utilisation is {{ $value | humanizePercentage }}."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatinghostcpusaturated

  - name: verified-dating-uptime
    interval: 30s
    rules:
      - alert: VerifiedDatingPublicEndpointDown
        expr: probe_success{job="connect-blackbox-http"} == 0
        for: 2m
        labels:
          severity: page
          owner: platform-oncall
        annotations:
          summary: "Public endpoint {{ $labels.instance }} is failing"
          description: "The blackbox probe against {{ $labels.instance }} has failed for two minutes (DNS, TLS, nginx, gateway or BFF)."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingpublicendpointdown

      - alert: VerifiedDatingServiceNotReady
        expr: probe_success{job="connect-blackbox-readiness"} == 0
        for: 3m
        labels:
          severity: page
          owner: backend-oncall
        annotations:
          summary: "{{ $labels.instance }} reports not ready"
          description: "The readiness endpoint answered non-200 for three minutes: a gRPC dependency (auth/profile/matching/chat) or PostgreSQL is unavailable to it."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingservicenotready

      - alert: VerifiedDatingRealtimeEndpointDown
        expr: probe_success{job="connect-blackbox-websocket"} == 0
        for: 5m
        labels:
          severity: page
          owner: backend-oncall
        annotations:
          summary: The public WebSocket endpoint is not reachable through nginx
          description: "An unauthenticated upgrade to {{ $labels.instance }} did not get the expected 401: the realtime route is broken at nginx, gateway or BFF."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingrealtimeendpointdown

      - alert: VerifiedDatingTLSCertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="connect-blackbox-http"} - time() < 14 * 86400
        for: 1h
        labels:
          severity: ticket
          owner: platform-oncall
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in less than 14 days"
          description: "Expires in {{ $value | humanizeDuration }}. certbot renewal is not working."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingtlscertificateexpiringsoon

      - alert: VerifiedDatingTLSCertificateExpiryImminent
        expr: probe_ssl_earliest_cert_expiry{job="connect-blackbox-http"} - time() < 3 * 86400
        for: 10m
        labels:
          severity: page
          owner: platform-oncall
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in less than three days"
          description: "Expires in {{ $value | humanizeDuration }}. Apps refuse to connect once it lapses."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingtlscertificateexpiryimminent

  - name: verified-dating-monitoring
    interval: 30s
    rules:
      # Always firing. Alertmanager routes it to a dead man's switch (for
      # example healthchecks.io); silence from it means paging is broken.
      - alert: VerifiedDatingWatchdog
        expr: vector(1)
        labels:
          severity: none
          owner: platform-oncall
        annotations:
          summary: Alerting pipeline heartbeat
          description: "Always firing by design. If the dead man's switch stops receiving it, Prometheus or Alertmanager is down."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingwatchdog

      - alert: VerifiedDatingPrometheusRuleFailures
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        labels:
          severity: ticket
          owner: platform-oncall
        annotations:
          summary: Prometheus failed to evaluate alerting or recording rules
          description: "{{ $value | humanize }} rule evaluations failed in rule group {{ $labels.rule_group }}; some alerts cannot fire."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingprometheusrulefailures

      - alert: VerifiedDatingAlertmanagerNotificationsFailing
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        for: 5m
        labels:
          severity: page
          owner: platform-oncall
        annotations:
          summary: "Alertmanager cannot deliver to the {{ $labels.integration }} receiver"
          description: "{{ $value | humanize }} notifications failed in 15 minutes. Check receiver credentials and egress."
          runbook_url: /documents/MONITORING_RUNBOOKS_2026-10-01.md#verifieddatingalertmanagernotificationsfailing
