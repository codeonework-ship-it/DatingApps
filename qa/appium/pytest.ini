[pytest]
addopts = -ra --strict-markers
markers =
    smoke: core mobile smoke path
    seed: seed and environment preflight checks
    contract: API/OpenAPI contract checks that do not require Appium
    signup: username/password signup and profile setup automation
    signin: existing-account username/password sign-in automation
    signup_edge: credential signup negative/boundary cases
    signup_workflow: complete credential signup through durable profile completion
    security_negative: release-blocking authentication and authorization negative paths
    core_journey: authenticated discovery, match, and persisted-chat device journey
    engagement_ui: device traversal of every documented engagement hub surface
    auth_contract: static guard for the username/password automation contract
    profile_setup: profile setup automation
    profile_setup_edge: profile setup validation and resume cases
    edit_profile: edit profile automation
    discovery: Discover and filter automation
    filters: discover filters automation
    discovery_matrix: discovery/filter API permutation matrix
    profile_detail: profile detail UI/API automation
    verification_safety: verification and safety UI automation
    swipe_matrix: swipe and match creation matrix
    matches: matches and chat automation
    match_matrix: matches list, read state, unmatch, and report matrix
    chat: chat automation
    chat_matrix: chat send, delete, and lock matrix
    gift_matrix: rose gifts, wallet, and telemetry matrix
    unlock_matrix: quest, gesture, activity, and unlock matrix
    account_lifecycle: account pause, data export, and deletion device journey
    resilience: network/background/keyboard/orientation edge cases
    negative: validation and error-path cases
    requires_appium: requires a running Appium server and Android emulator
