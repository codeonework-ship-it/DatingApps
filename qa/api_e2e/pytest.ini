[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    journey(name): member journey covered by the test
    authz: authorization, IDOR and actor-spoofing checks (member A vs member B)
    validation: input validation and edge-case payloads (lengths, unicode, HTML, SQL-ish)
    pagination: limit/cursor bounds on list endpoints
    idempotency: Idempotency-Key replay and conflict semantics
    concurrency: racing requests sent from threads
    quota: daily quotas and rate limits
    lifecycle: deactivated, deleted, suspended or logged-out accounts
    flags: runtime feature flags and their off-states
    security: session, token and transport hardening
    safety: block, report, appeals, emergency contacts, verification
    billing: wallet, coins, gifts, subscriptions (sandbox provider only)
    known_defect(id): documents an open product defect (paired with a strict xfail)
