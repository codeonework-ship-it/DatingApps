# Flutter localisation codegen (`flutter gen-l10n`, also run by every build
# because pubspec.yaml sets `flutter: generate: true`).
#
# Template: en (en-US); other locales: en_GB, de, fr, ru, es, it, pt, nl, pl.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
