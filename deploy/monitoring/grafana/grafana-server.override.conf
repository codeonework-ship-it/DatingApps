# Drop-in for the APT grafana-server unit:
#   /etc/systemd/system/grafana-server.service.d/connect.conf
[Service]
EnvironmentFile=/etc/connect-monitoring/grafana.env
NoNewPrivileges=yes
ProtectSystem=full
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
