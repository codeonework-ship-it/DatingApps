# Optional: publish Grafana under https://<domain>/grafana/ (OPTION A).
#
# Install:
#   sudo install -m 0644 deploy/nginx/snippets/connect-grafana.conf /etc/nginx/snippets/connect-grafana.conf
#   sudo htpasswd -B -c /etc/nginx/connect-grafana.htpasswd <operator>   # apache2-utils
#   uncomment "include /etc/nginx/snippets/connect-grafana.conf;" in connect.conf
#   replace the allow lines below with your office / VPN egress addresses
#   sudo nginx -t && sudo systemctl reload nginx
# Grafana must run with GF_SERVER_ROOT_URL=https://<domain>/grafana/ and
# GF_SERVER_SERVE_FROM_SUB_PATH=true (deploy/monitoring/grafana/grafana.env.example).
#
# Three gates: source address allowlist, nginx basic auth, Grafana login.
# Prometheus, Alertmanager, Loki and the exporters are NEVER published; reach
# them with an SSH tunnel (ssh -L 9090:127.0.0.1:9090 <vps>).

location ^~ /grafana/ {
    satisfy all;
    # allow 203.0.113.10;        # office
    # allow 198.51.100.0/24;     # VPN
    allow 127.0.0.1;
    deny all;

    auth_basic "Connect monitoring";
    auth_basic_user_file /etc/nginx/connect-grafana.htpasswd;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Grafana Live uses WebSockets.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Do not forward the basic-auth header to Grafana (its own login is separate).
    proxy_set_header Authorization "";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
}
