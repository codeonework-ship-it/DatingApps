# Optional: publish Grafana on its own host name (OPTION B), e.g.
# monitoring.connect.example.com, instead of the /grafana/ sub-path.
#
# Install:
#   sudo install -m 0644 deploy/nginx/connect-monitoring.conf /etc/nginx/sites-available/connect-monitoring.conf
#   sudo ln -sf /etc/nginx/sites-available/connect-monitoring.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d monitoring.connect.example.com
#   sudo htpasswd -B -c /etc/nginx/connect-grafana.htpasswd <operator>
#   sudo nginx -t && sudo systemctl reload nginx
# Then set in /etc/connect-monitoring/grafana.env:
#   GF_SERVER_ROOT_URL=https://monitoring.connect.example.com/
#   GF_SERVER_SERVE_FROM_SUB_PATH=false
# Requires the $connection_upgrade map from connect.conf (loaded in the same
# http{} context).

server {
    listen 80;
    listen [::]:80;
    server_name monitoring.connect.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitoring.connect.example.com;

    ssl_certificate     /etc/letsencrypt/live/monitoring.connect.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring.connect.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    satisfy all;
    # allow 203.0.113.10;        # office
    # allow 198.51.100.0/24;     # VPN
    deny all;
    auth_basic "Connect monitoring";
    auth_basic_user_file /etc/nginx/connect-grafana.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization "";
    }
}
