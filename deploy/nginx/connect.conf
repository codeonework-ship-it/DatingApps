# Connect — nginx site for an Ubuntu VPS.
# Install:
#   sudo install -m 0644 deploy/nginx/connect.conf /etc/nginx/sites-available/connect.conf
#   sudo ln -sf /etc/nginx/sites-available/connect.conf /etc/nginx/sites-enabled/connect.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Replace connect.example.com and the certificate paths (certbot --nginx works).
#
# Upstreams (loopback only; set in /etc/connect/connect.env):
#   api-gateway  127.0.0.1:8080   (API_GATEWAY_ADDR=127.0.0.1:8080)
#   website      127.0.0.1:4190   (connect-website.service)
#
# Media: nginx NEVER exposes the media directory directly. The API authorizes
# each request (photo exists, approved, not deleted, viewer allowed) and then
# answers with "X-Accel-Redirect: /_connect_media/public/..." when
# MEDIA_LOCAL_ACCEL_REDIRECT_PREFIX=/_connect_media/. Only public/ is mapped;
# private/, quarantine/ and tmp/ are always streamed by the API itself.

upstream connect_gateway {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream connect_website {
    server 127.0.0.1:4190;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name connect.example.com www.connect.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 22.04/24.04 ship nginx < 1.25.1: use "listen ... ssl http2".
    # On nginx >= 1.25.1 replace with "listen 443 ssl;" + "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name connect.example.com www.connect.example.com;

    ssl_certificate     /etc/letsencrypt/live/connect.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connect.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:connect_tls:10m;

    server_tokens off;
    autoindex off;
    # Identity evidence (two images) is the largest upload: ~22 MB.
    client_max_body_size 25m;
    client_body_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── Internal media location (reachable only via X-Accel-Redirect) ──────
    location ^~ /_connect_media/public/ {
        internal;
        alias /var/lib/connect/media/public/;
        autoindex off;
        disable_symlinks on;
        limit_except GET HEAD { deny all; }
        # The API decides cacheability (private, max-age=300): profile photos
        # must disappear quickly after deletion or re-moderation.
        add_header Cache-Control "private, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        types {
            image/jpeg jpg jpeg;
            image/png  png;
            image/webp webp;
        }
        default_type application/octet-stream;
        sendfile on;
        tcp_nopush on;
        open_file_cache max=2000 inactive=60s;
    }
    # Everything else under the internal prefix (private/, quarantine/, tmp/)
    # does not exist for nginx.
    location ^~ /_connect_media/ {
        internal;
        return 404;
    }

    # ── Realtime: WebSocket upgrade (/v1/realtime/chat) and event streams
    #    (/v1/realtime/notifications) ─────────────────────────────────────────
    location ^~ /v1/realtime/ {
        proxy_pass http://connect_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── API ─────────────────────────────────────────────────────────────────
    location /v1/ {
        proxy_pass http://connect_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream uploads to the API instead of spooling them to nginx disk.
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    location = /healthz { proxy_pass http://connect_gateway; }
    # Readiness and metrics are for the host and monitoring only.
    location = /readyz  { allow 127.0.0.1; allow ::1; deny all; proxy_pass http://connect_gateway; }
    location = /metrics { deny all; }
    # Monitoring (documents/MONITORING_AND_OBSERVABILITY_2026-10-01.md):
    # Prometheus/Alertmanager/Loki/exporters stay on loopback and are never
    # proxied. Grafana may be published under /grafana/ behind an IP allowlist
    # and basic auth by uncommenting the next line (or use
    # deploy/nginx/connect-monitoring.conf for a separate host name).
    # include /etc/nginx/snippets/connect-grafana.conf;
    location = /openapi.yaml { proxy_pass http://connect_gateway; }
    location ^~ /docs { proxy_pass http://connect_gateway; }

    # Never serve dotfiles or backup files.
    location ~ /\.(?!well-known/) { deny all; }

    # ── Website + web app ───────────────────────────────────────────────────
    location / {
        proxy_pass http://connect_website;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
