# systemd-tmpfiles definition for Connect state and media directories.
# Install: sudo install -m 0644 deploy/tmpfiles.d/connect.conf /etc/tmpfiles.d/connect.conf
#          sudo systemd-tmpfiles --create /etc/tmpfiles.d/connect.conf
# Requires the "connect" system user (deploy/scripts/setup_media_storage.sh).
# The mobile BFF re-validates this layout at every start and refuses to boot
# if a directory is missing, a symlink, world-writable or not writable.
#
# Type Path                                          Mode User    Group   Age
d     /var/lib/connect                               0750 connect connect -
d     /var/lib/connect/spool                         0700 connect connect -
d     /var/lib/connect/media                         0750 connect connect -
d     /var/lib/connect/media/public                  0750 connect connect -
d     /var/lib/connect/media/public/profile_photos   0750 connect connect -
d     /var/lib/connect/media/public/legacy_profile_photos 0750 connect connect -
d     /var/lib/connect/media/public/group_covers     0750 connect connect -
d     /var/lib/connect/media/quarantine              0700 connect connect -
d     /var/lib/connect/media/quarantine/profile_photos 0700 connect connect -
d     /var/lib/connect/media/private                 0700 connect connect -
d     /var/lib/connect/media/private/chapter_photos  0700 connect connect -
d     /var/lib/connect/media/private/theme_photos    0700 connect connect -
d     /var/lib/connect/media/private/voice           0700 connect connect -
d     /var/lib/connect/media/private/verification    0700 connect connect -
# In-progress uploads: abandoned temp files older than a day are removed
# (the app also sweeps them hourly).
d     /var/lib/connect/media/tmp                     0700 connect connect 1d
d     /etc/connect                                   0750 root    connect -
