{% extends "control_panel/base.html" %}
{% block title %}Operator sign in{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="glass-card auth-card">
    <div class="text-center mb-4">
      <div class="display-5 mb-2">🛡️</div>
      <h2>Operator sign in</h2>
      <p class="text-muted mb-0">Use your approved username and password.</p>
    </div>
    {% if error %}<div class="alert-glass warning" role="alert"><i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>{{ error }}</div>{% endif %}
    <form method="post" autocomplete="off">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input id="username" name="username" class="form-control" required autofocus autocomplete="username">
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <input id="password" name="password" type="password" class="form-control" required autocomplete="current-password">
      </div>
      <button class="btn btn-glow w-100" type="submit">Sign in securely</button>
    </form>
  </div>
</div>
{% endblock %}
